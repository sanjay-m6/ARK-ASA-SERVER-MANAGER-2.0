name: Build & Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      
      - name: Rust Cache
        uses: swatinem/rust-cache@v2.7.5
        with:
          workspaces: 'src-tauri -> target'
      
      - name: Install Dependencies
        run: npm ci
      
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0.5.15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ARK Server Manager ${{ github.ref_name }}'
          releaseBody: |
            ## 🚀 ARK Server Manager ${{ github.ref_name }}

            This release brings support for ARK: Survival Ascended (ASA) and ARK: Survival Evolved (ASE) along with crucial bug fixes, preset selector sharing, and performance updates.

            ### ✨ What's New
            - **Critical Bugfix: ASA Config Directory**: Fixed a path resolution bug where ASA configurations (admin password, RCON configuration, max players) were written to the wrong folder, rendering RCON and in-game admin cheats/GCM unusable.
            - **Traditional Chinese (zh-TW)**: Full localization with Traditional Chinese support.
            - **CurseForge Mod URL Parser**: Added automatic parsing and extraction of numeric Mod IDs directly from CurseForge URLs.
            - **Custom Presets Export/Import**: Export and import custom server configs as JSON files.
            - **SteamCMD Error Recovery**: Diagnostic tips and repair/retry recovery buttons when encountering SteamCMD errors.
            - **Tribe Log native viewer panel & UPnP controls**.

            ### Install
            Download the `.msi` installer below.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          includeUpdaterJson: true
