name: Build & Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
      
      - name: Install Dependencies
        run: npm ci
      
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ASA Server Manager ${{ github.ref_name }}'
          releaseBody: |
            ## 🚀 v2.3.7 — Infinity AI Dashboard & Integrated Wiki

            ### 🤖 Infinity AI Platform
            - **Multi-Session Conversations**: Chat sidebar supporting multiple isolated chat contexts, history retention, and persistent sessions.
            - **AI Logic Expansion**: Enhanced Tauri integration for real-time system troubleshooting and log interpretation.

            ### 📖 Dynamic Documentation Portal
            - **Integrated Wiki**: Complete offline documentation viewer powered by local Markdown ingestion and fluid page navigation.
            - **Liquid Glass Design**: Fully modernized documentation dialogs, icon selectors, and content editors.

            ### ⚡ Core Enhancements
            - **Theme Modernization**: Continued migration to Prestige Dark aesthetics across layouts.
            - **Build Fixes**: Resolved compilation warnings and updated package metadata schemas for stable distributions.

            ### Install
            Download the `.msi` installer below.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

