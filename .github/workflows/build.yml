name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_BUILD_JOBS: 2

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Free up space on C: drive by removing heavy unneeded SDKs
          Remove-Item -Recurse -Force "C:\Android" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\hostedtoolcache\windows\Java" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\hostedtoolcache\windows\Ruby" -ErrorAction SilentlyContinue

      - name: Configure Windows Pagefile
        if: runner.os == 'Windows'
        uses: al-cheb/configure-pagefile-action@v1.5
        with:
          minimum-size: 8GB
          maximum-size: 16GB
          disk-root: "C:"

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
            echo "version=v${VERSION}" >> "$GITHUB_OUTPUT"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install Dependencies
        run: npm ci

      - name: Clean signing key
        shell: bash
        run: |
          CLEAN_KEY=$(echo -n "$RAW_KEY" | tr -d '\r\n ')
          echo "TAURI_SIGNING_PRIVATE_KEY=$CLEAN_KEY" >> $GITHUB_ENV
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0.5.15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          CARGO_BUILD_JOBS: 2
          NODE_OPTIONS: "--max_old_space_size=4096"
        with:
          tagName: ${{ steps.version.outputs.version }}
          releaseName: 'ARK Server Manager ${{ steps.version.outputs.version }}'
          prerelease: false
          # Note: GitHub Actions limits expressions to 21,000 characters. Keep only the current release
          # and immediate prior release in releaseBody; historical changelogs are in CHANGELOG.md.
          releaseBody: |
            ## 🚀 ARK Server Manager ${{ steps.version.outputs.version }} (Latest Release)

            ### Installation
            - **Auto-Update**: If you already have the app installed, it will auto-detect this release and prompt you to update.
            - **Windows**: Download the `.exe` installer below.
            - **Linux Desktop**: Download the `.AppImage` or `.deb` package below (`chmod +x *.AppImage` to run).
            - **Linux Headless / CLI**: Run `curl -fsSL https://raw.githubusercontent.com/sanjay-m6/ARK-ASA-SERVER-MANAGER-2.0/main/scripts/install.sh | bash`

            ### 🆕 New Features & Bug Fixes in v4.6.30
            - **⏰ Fix Staggered Scheduled Restarts Skipping Subsequent Maps (Extinction, Gen1, Valguero)**:
              - Resolved critical issue where staggered morning/afternoon restarts (e.g. 06:00, 06:03, 06:06, 06:12, 06:18) successfully restarted the first servers (Astraeos and The Island) but completely skipped subsequent maps (Extinction, Gen1, Valguero).
              - Offloaded all server maintenance execution chains (`process_asa_advanced_mode`, `process_ase_advanced_mode`, `process_tasks`, `process_basic_mode`, and `process_ase_basic_mode`) to asynchronous background tasks via `tauri::async_runtime::spawn`. The scheduler ticker loop now returns in <1ms without blocking on lengthy `SaveWorld`, graceful stop, backup, or SteamCMD operations.
              - Enhanced `parse_time_str` to support European dot notation (e.g. `6.00`, `6.03`, `06.00`, `06:12`) by normalizing `.` to `:` and parsing 1- or 2-part time strings cleanly.
              - Added scheduling catch-up tolerance (2-minute window) protected by a 180-second debounce so minor timer drifts or busy ticks never cause scheduled restarts to be missed.
            - **🛡️ Fix ASE Port 7778 Collision & Instant Exit (Code 0) on The Island & Valguero**:
              - Resolved issue where ASE servers terminated immediately upon launch or restart with exit code 0 (`STATUS_SUCCESS`).
              - Added `PeerPort` (`port + 1`, UDP 7778) to `AseLauncher::stop_server` and `AseLauncher::spawn_server` port tracking and socket cleanup routines, ensuring `ShooterGameServer.exe`'s raw/peer UDP port is completely freed before the new instance starts.
              - Increased restart socket release cooldown from 2s to 4s in `restart_ase_server` and scheduler maintenance chains to allow complete Windows UDP socket deallocation.
            - **🗺️ Fix Gen1 (Genesis Part 1) Failing to Start & Official Map Normalization**:
              - Resolved issue where Genesis Part 1 stopped but failed to start due to spaces in the launch command URL (`"Genesis Part 1?listen"`), which Unreal Engine rejected.
              - Added `normalize_ase_map_name` in `AseLauncher` to format map parameters into canonical ASE engine map names (`Genesis`, `Valguero_P`, `ScorchedEarth_P`, `Aberration_P`, `TheCenter`, `Gen2`, etc.).
              - Added Genesis Part 1 / Gen1 (`Genesis_WP`) and Genesis Part 2 / Gen2 (`Genesis2_WP`) to `normalize_map_name` in `config_generator.rs` so they are correctly recognized as official maps.
            - **💾 Fix Astraeos Database Corruption & Automatic SQLite Healing (`FAtlasSaveManager`)**:
              - Resolved issue where large ASA maps suffered save file corruption (`FAtlasSaveManager::LoadOperationSql: SQL database is corrupt`) after restarts.
              - Extended `graceful_stop` wait from 10s to 30s with progress logging, giving `ArkAscendedServer.exe` sufficient time to flush WAL frames and checkpoint SQLite safely before any fallback kill.
              - Implemented `auto_heal_corrupted_sqlite_save` in `perform_server_startup_inner`: automatically runs `PRAGMA quick_check;` before launch. If corruption is detected, it archives the damaged file as `<Map>_corrupted_<timestamp>.db`, finds and verifies the newest healthy backup (`.bak` or timestamped `.db`), restores it to `<Map>.db`, and clears stale `.db-wal` and `.db-shm` files.
            - **🛡️ Fix Guardian Watchdog Self-Healing & Crash Recovery (Auto-Restart After Crash/Taskkill)**:
              - Resolved critical issue where Guardian Watchdog was toggled ON in the UI, but killed or crashed server instances (e.g. via `taskkill /F /PID` or unhandled exceptions) stopped and never came back alive.
              - Fixed database disconnect where `GuardianService::register_server` queried `servers.auto_restart` (defaulting to 0) rather than `scheduler_settings.watchdog_enabled`, causing Guardian to reset its in-memory watchdog state to disabled on every server startup. Added authoritative SQLite queries checking both settings.
              - Fixed false clean-exit classification in `ProcessManager`: unauthorized exits with exit code 1 (produced by Windows `TerminateProcess` / `taskkill /F`) or 3 were previously misclassified as graceful `"stopped"` instead of `"crashed"`.
              - Fixed ASE launcher child exit listener unconditionally overriding server state to `"stopped"` on termination. It now verifies if the server was intentionally stopped before setting status, and marks unexpected exits as `"crashed"`.
              - Implemented instant event-driven recovery: `ProcessManager` and `AseLauncher` now immediately trigger `GuardianService::trigger_auto_restart_if_enabled` upon detecting an unexpected process exit (~3s recovery latency), transitioning the server status to `"restarting"`, enforcing crash-loop protection limits, and automatically restarting the instance.

            ### 🛠️ Previous Releases
            <details>
            <summary>v4.6.29 — Fix Multi-Server / Cluster Process Hijacking & Cross-Server Crashes</summary>

            - **🛡️ Fix Multi-Server / Cluster Process Hijacking & Cross-Server Crashes**:
              - Resolved critical issue where starting a cloned or clustered server (e.g. Scorched Earth sharing install directory or parent paths with The Island) caused Server Manager to falsely adopt the running PID for other servers, displaying both as running and causing one to crash/terminate when the other was stopped.
              - Enforced strict process exclusivity across the process manager: a single OS PID can never be assigned or adopted by more than one server instance in memory.
              - Rewrote `find_game_server_pid_by_install_path` to strictly match by unique network ports (`query_port` and `game_port` via command line and UDP listening sockets) whenever ports are configured, eliminating fallback to ambiguous install directory matching for multi-instance deployments.
              - Added `exclude_pids` enforcement across periodic process adoption monitoring, startup recovery, Guardian Watchdog, and status checks so active server PIDs are never claimed by another server profile.
              - Scoped `show_server_window` strictly to the targeted server PID and its direct child process, removing indiscriminate global window un-hiding that forced other servers' console windows to show.
            </details>

            *For full release notes of previous versions, please visit the [Releases Archive](https://github.com/sanjay-m6/ARK-ASA-SERVER-MANAGER-2.0/releases) or see [CHANGELOG.md](https://github.com/sanjay-m6/ARK-ASA-SERVER-MANAGER-2.0/blob/main/CHANGELOG.md).*
          releaseDraft: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Verify Release Signatures
        run: node scripts/verify-release-signatures.js
