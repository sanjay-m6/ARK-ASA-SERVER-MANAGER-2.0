name: Build & Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
      
      - name: Install Dependencies
        run: npm ci
      
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ASA Server Manager ${{ github.ref_name }}'
          releaseBody: |
            ## 🚀 v2.2.6: Mod Filters & Firewall Automation!
            
            **This is a major feature update focusing on Mod Management and Automation.**
            
            ### 🔥 New Features
            - **Mod Filters**: Filter by Category (Dinos, Maps, etc.) & Sort by Popularity.
            - **Smart ID Search**: Instant result when searching by Mod ID (e.g. `928708`).
            - **Firewall Auto-Pilot**: Automatically manages ports 7777/27015/RCON.
            - **Smart Monitoring**: Active TCP/UDP checks for 100% accurate status.
            
            ### 🐛 Bug Fixes
            - Fixed "Exit Code 3" crash loops (Auto-Repair added).
            - Fixed "No Mods Found" on direct ID search.
            - Fixed stuck loading screens & Config Editor glitches.
            
            ### Install
            Download the `.setup.exe` or `.msi` below.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
