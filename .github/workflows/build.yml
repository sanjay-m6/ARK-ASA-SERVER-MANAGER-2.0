name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-2025
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      
      - name: Rust Cache
        uses: swatinem/rust-cache@v2.9.1
        with:
          workspaces: 'src-tauri -> target'
      
      - name: Install Dependencies
        run: npm ci
      
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0.5.15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ARK Server Manager ${{ github.ref_name }}'
          releaseBody: |
            ## 🚀 ARK Server Manager ${{ github.ref_name }}

            This release focuses on application optimizations, database indexing, and user interface refinements.

            ### ✨ What's New
            - **⚡ Cargo Release Profile Optimizations**: Configured Link-Time Optimization (`lto = true`), abort panic behavior, and debug symbol stripping to reduce executable size by ~20-30MB and optimize runtime CPU execution speeds.
            - **🗄️ SQLite Database Query Indexes**: Added indexes on `server_folder_members` and `server_activity_log` to eliminate full-table scans, greatly improving dashboard folder loading speeds and activity logging performance.
            - **🎛️ Drag-and-Drop Jitter/Lag Fixes**: Disabled transform transitions on server cards during active dragging, preventing layout jumping and keeping the card locked smoothly to the cursor position.
            - **🧹 Compiler Warning Cleanup**: Resolved unused import warnings in the backend process manager.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          includeUpdaterJson: true
