name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      
      - name: Rust Cache
        uses: swatinem/rust-cache@v2.7.5
        with:
          workspaces: 'src-tauri -> target'
      
      - name: Install Dependencies
        run: npm ci
      
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0.5.15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ARK Server Manager ${{ github.ref_name }}'
          releaseBody: |
            ## 🚀 ARK Server Manager ${{ github.ref_name }}

            This release introduces active monitoring and auto-restart support for ARK: Survival Evolved (ASE) servers via the Guardian Watchdog service, periodic MOTD RCON announcements, and an advanced Enterprise Server Organization dashboard with nested folders and archiving.

            ### ✨ What's New
            - **🛡️ Guardian Watchdog for ASE**: Full active monitoring, process health tracking, and automated crash recovery with Loop Prevention for ASE server instances.
            - **📢 Automated MOTD Announcements**: Periodically broadcast in-game MOTD messages via RCON scheduler settings for online ASE servers.
            - **📂 Enterprise Server Organization**: Organize server instances dynamically with multi-nested folders, customizable colors, and visual tags on the dashboard.
            - **💾 Archive & Restore System**: Clean up your active dashboard by archiving inactive servers with notes while retaining their database configurations for future restorations.
            - **🎨 Dashboard Layout Customization**: Save and switch between custom grid/list layout configurations, views, and pinning preferences per user.

            ### Install
            Download the `.msi` or `.exe` installer below.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          includeUpdaterJson: true
