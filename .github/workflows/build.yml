name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
            echo "version=v${VERSION}" >> "$GITHUB_OUTPUT"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install Dependencies
        run: npm ci

      - name: Clean signing key
        shell: bash
        run: |
          CLEAN_KEY=$(echo -n "$RAW_KEY" | tr -d '\r\n ')
          echo "TAURI_SIGNING_PRIVATE_KEY=$CLEAN_KEY" >> $GITHUB_ENV
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0.5.15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ steps.version.outputs.version }}
          releaseName: 'ARK Server Manager ${{ steps.version.outputs.version }}'
          prerelease: false
          # Note: GitHub Actions limits expressions to 21,000 characters. Keep only the current release
          # and immediate prior release in releaseBody; historical changelogs are in CHANGELOG.md.
          releaseBody: |
            ## 🚀 ARK Server Manager ${{ steps.version.outputs.version }} (Latest Release)

            ### Installation
            - **Auto-Update**: If you already have the app installed, it will auto-detect this release and prompt you to update.
            - **Windows**: Download the `.exe` installer below.
            - **Linux Desktop**: Download the `.AppImage` or `.deb` package below (`chmod +x *.AppImage` to run).
            - **Linux Headless / CLI**: Run `curl -fsSL https://raw.githubusercontent.com/sanjay-m6/ARK-ASA-SERVER-MANAGER-2.0/main/scripts/install.sh | bash`

            ### 🆕 New Features & Bug Fixes in v4.6.25
            - **⚡ ASE Cluster Port Conflict Resolution & Validation Engine (`cluster.rs`)**:
              - Resolved false-positive Port Collision alerts (e.g. *"Multiple servers are using Game Port 7777"*) occurring during ARK: Survival Evolved (ASE) cluster validation even when individual servers had distinct unique ports configured in the UI.
              - Fixed database column index extraction in `validate_ase_cluster` to accurately map `port`, `query_port`, and `rcon_port`.
              - Added robust deep inspection parsing for launch arguments (`?Port=`, `?QueryPort=`, `?RCONPort=`) and `GameUserSettings.ini` values to ensure the cluster validator verifies actual runtime ports rather than stale database defaults.
              - Upgraded validation error reporting to identify conflicting server names and IDs directly, providing actionable remediation steps.
            - **⚡ ASE Clustered Server Version Mismatch Resolution (`ASEServerManager.tsx`)**:
              - Resolved persistent "Cluster Mismatch" dashboard warnings (*"Version mismatch detected among clustered servers! Ensure all servers are updated"*) that persisted even after running server updates multiple times.
              - Replaced superficial timestamp and raw build string comparisons with canonical integer Steam Build ID extraction (`buildid` from `steamapps/appmanifest_376030.acf`), ensuring accurate version consistency across all servers in a cluster.
            - **⚡ Automatic `ClusterDirOverride` Injection & Bidirectional INI Sync (`config.rs`, `server.rs`)**:
              - Implemented automatic injection of `-ClusterDirOverride="<path>"` into server launch arguments upon cluster association or path update, ensuring seamless cross-server survivor and dinosaur transfers.
              - Normalized Windows backslash paths to prevent Unreal Engine dedicated server path parsing errors.
              - Enforced bidirectional synchronization of `Port`, `QueryPort`, and `RCONPort` across SQLite database records, server launch arguments, and `GameUserSettings.ini`.
            - **🛡️ Guardian & Process Manager Health Check Alignment**:
              - Updated background health monitor in `guardian.rs` and process launcher in `process_manager.rs` to monitor the resolved runtime Game Port rather than falling back to default port 7777.
            - **🛠️ Rust Analyzer & Diagnostic Hardening (`discord_panel.rs`, `rcon.rs`)**:
              - Cleaned up string formatting macros across `discord_panel.rs` and `rcon.rs` using direct type conversions (`.to_string()`, `.as_str()`) to prevent macro-expansion ambiguities and IDE diagnostic warnings.

            ### 🛠️ Previous Releases
            <details>
            <summary>v4.6.24 — Online CurseForge Mod Update Checking & Rollback-Protected Push Engine</summary>

            - **⚡ Online CurseForge Mod Update Checking & Batch Synchronization**:
              - Added direct **"Check Updates"** capability to the Installed Server Mods Management section (`/mods`).
              - Built high-performance batch query engine (`check_server_mod_updates`) querying CurseForge API in a single HTTP request for all installed mods on the server without N+1 overhead.
              - Accurately compares remote file release dates (`dateModified`, `latestFiles`) and version strings against local SQLite database records and on-disk files.
              - Displays eye-catching **`{N} Updates Ready`** badge in the header, introduces a dedicated **`Updates ({N})`** filter tab, and renders animated **`Update Ready (vX.X)`** badges directly on affected mod cards.
            - **🛡️ Rollback-Protected Mod Update Push Engine (`push_mod_updates`)**:
              - **100% Rollback Protection**: Automatically archives existing mod folders into `ShooterGame/Saved/ModBackups/{modId}_{timestamp}` before modifying or removing files.
              - **Pre-Patch Crash Loop Prevention & Clean Cache Purge**: Automatically sweeps and purges stale `.pak` and temporary mod cache files in `ShooterGame/Binaries/Win64/ShooterGame/Mods/{id}` and `.temp/` directories. This prevents the dedicated server binary from crashing on boot due to outdated/mismatched pre-patch assets during major game updates.
              - **Database & INI Synchronization**: Automatically synchronizes updated mod version tags, names, and timestamps in SQLite, and ensures active mod lists are written to `GameUserSettings.ini`.
              - **Graceful Running Server Restarts & RCON Warning Countdowns**: If the server is actively running, administrators can trigger broadcast player warning announcements via RCON (Immediate, 1 min, 3 min, or 5 min), execute world saves (`saveworld`), cleanly stop the instance, and automatically reboot.
              - **Discord Webhook Alerts**: Automatically dispatches notification embeds to configured Discord webhooks when mod updates are pushed and servers are restarted.
            - **💻 Interactive Mod Push Modal (`PushModUpdatesModal.tsx`)**:
              - Provides multi-mod selection checklist with Select All / Deselect All controls, version comparison, rollback protection indicators, server restart controls, and live step-by-step progress status.
              - Supports both bulk updates ("Push All Updates") and targeted single-mod updates ("Push Update").
            - **🛠️ Rust Analyzer IDE Diagnostics Fix**:
              - Configured `rust-analyzer.linkedProjects` and `rust-analyzer.check.command` in `.vscode/settings.json` to resolve false-positive `format!` macro-expansion diagnostics in Tauri subfolder projects on modern Rust toolchains.
            </details>

            *For full release notes of previous versions, please visit the [Releases Archive](https://github.com/sanjay-m6/ARK-ASA-SERVER-MANAGER-2.0/releases) or see [CHANGELOG.md](https://github.com/sanjay-m6/ARK-ASA-SERVER-MANAGER-2.0/blob/main/CHANGELOG.md).*
          releaseDraft: false
          includeUpdaterJson: true

      - name: Verify Release Signatures
        run: node scripts/verify-release-signatures.js
