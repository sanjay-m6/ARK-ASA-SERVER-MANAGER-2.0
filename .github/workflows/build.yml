name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-2025
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
            echo "version=v${VERSION}" >> "$GITHUB_OUTPUT"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install Dependencies
        run: npm ci

      - name: Clean signing key
        shell: bash
        run: |
          CLEAN_KEY=$(echo -n "$RAW_KEY" | tr -d '\r\n ')
          echo "TAURI_SIGNING_PRIVATE_KEY=$CLEAN_KEY" >> $GITHUB_ENV
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0.5.15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ steps.version.outputs.version }}
          releaseName: 'ARK Server Manager ${{ steps.version.outputs.version }}'
          releaseBody: |
            ## 🚀 ARK Server Manager ${{ steps.version.outputs.version }}

            ### Installation
            - **Auto-Update**: If you already have the app installed, it will auto-detect this release and prompt you to update.
            - **Fresh Install**: Download the `.exe` installer below and run it.

            ### 🆕 New Features & Improvements in v4.6.2
            - **🛠️ Automated Maintenance Sequence Overhaul**:
              - **Visual Skipped Steps**: Skipped/unchecked steps in the maintenance timeline are visually rendered as dashed, lower-opacity, and lined-through icons.
              - **Smart RCON Polling**: Replaced the 30-second blind boot sleep with active polling on the RCON port (up to 90 seconds), proceeding immediately when ready.
              - **Instant Abort Feedback**: Clicking "Abort" now resets the UI state back to idle immediately, while the background process exits gracefully at the next await check.
            - **📡 Dual-Store System Status indicator (Online/Offline) Fix**:
              - The main sidebar/topbar status indicators now accurately check either `useServerStore` (ASA) or `useAseServerStore` (ASE) depending on the active game mode.
              - Expanded the active status checks to include all transitional states (`online`, `running`, `starting`, `updating`, `restarting`, `stopping`) instead of just `running`.
            - **🛡️ Mod Startup Crash & Warnings Fix**:
              - **Mod ID "0" Filter**: Added database and configuration filters to discard invalid mod IDs like `"0"`, which previously crashed the server engine on startup.
              - **False-Positive Mod Warning Suppression**: Batch-processes and filters the log stream to silence the annoying false-positive "Not all mods were installed" warning if 0 mods failed.
            - **🦖 Mod Manager Drag-and-Drop & Bulk Actions**:
              - Fully integrated drag-and-drop mod reordering with index mapping and visual highlight states.
              - Added quick "Enable All" and "Disable All" bulk controls utilizing a single fast Rust database command.
              - Included a premium fallback mod thumbnail icon for failed or missing CurseForge images.
            - **🎨 Premium UI Overhauls**:
              - **Full-Width Server Control Hub**: Top full-width layout for high-density server listings.
              - **Pill-Shaped Floating Actions**: Compact bulk actions bar with balanced padding.
              - **Pulsing Circular Spinners**: Unique start/stop circular ring progress spinners for real-time lifecycle tracking.
              - **Toggle Knob Anchoring**: Fixed misaligned knobs by correctly centering the layout.
            - **🔌 Per-Server ASA Plugin Manager**: Complete per-server plugin manager in the UI for ASA servers. Discovered plugins are fully parsed for manifests (`PluginInfo.json`), status checks, and dependency validation.
            - **⚙️ API Loader and DLL Renaming**: Frontend UI toggle and backend support to switch the server launch executable between `AsaApiLoader.exe` (with loader console output enabled) and the native `ArkAscendedServer.exe`.
            - **📁 Custom SteamCMD Path Redirect**: Redirect SteamCMD and server workshop downloads to a custom folder path. The settings page automatically validates and warns against non-ASCII/non-English characters to prevent crashes.
            - **🧹 SteamCMD Cache Cleaning & Lock Release**: Enhanced cache clearing by terminating lingering `steamcmd.exe` processes before cleaning, and deleting stale `.acf` appmanifests to resolve update loops.
            - **📱 Collapsible Sidebar & Evolved Support Settings**: Redesigned sidebar with a collapsible layout, tooltips, and a setting switch to hide/show ARK: Survival Evolved (ASE) support to keep the manager streamlined.
            - **♿ Accessibility & Modal Improvements**: Replaced standard modal dialogs in Scheduler with React Portals (`createPortal`) and updated elements/buttons with proper ARIA attributes and focus styles.

            ### 🛠️ Previous Releases
            <details>
            <summary>v4.6.1 — AI Co-Pilot Notification Center, Diagnostics & Toast Suppression</summary>

            - **🛡️ AI Co-Pilot Notification Center**: Unified crash notification center with in-memory caching, server-wide grouping/deduplication, sequential queue AI analysis, and historical archive modal.
            - **🌐 Diagnostics Reachability Fallback**: Integrated RCON TCP local connectivity checks and process manager startup confirmation to prevent Windows loopback firewall false-negatives.
            - **🧩 Optional CurseForge Mod Alerts**: Automatically suppresses all CFCore mod-loading warnings and crash notifications for plugins-only servers (with 0 enabled mods).
            - **🔕 Log Anomaly Toast Suppression**: Silences active server toast warnings for generic log anomalies (Crash, Fatal Error, Exception), caching them solely for post-crash diagnostic enrichment.
            </details>
            <details>
            <summary>v4.6.0 — Native C++ CrossChat, Chat Persistence & Real-Time Logs</summary>

            - **💬 Native C++ CrossChat Plugin (AsaApi)**: Introduced a native C++ plugin (`AsaCrossChat.dll`) for Ark Server API (AsaApi) enabling cross-server cluster chat sync via a shared MySQL/MariaDB database.
            - **⚡ Chat Persistence & Startup Safety**: Fixed the "lost chat messages on startup" bug. The native plugin now persists the last fetched message ID in a local file (`last_fetched_id.txt`) and delays DB querying until the game world is fully initialized (`GetWorld() != nullptr`).
            - **👁️ Real-Time Log Streaming Fixes**: Overhauled the log tailing engine to use parent directory monitoring, resolving Windows file locking/flush delays. Added auto-initialization for already running servers on log stream startup.
            </details>
            <details>
            <summary>v4.5.5 — Overhauled Auto-Update System & ASE Config Fixes</summary>

            - **🔄 Rewritten Auto-Update System**: Completely overhauled the update checker with robust error handling, elevation detection, portable ZIP fallback, and direct download URLs when auto-update fails.
            - **🦕 ASE Boolean Config Fix**: Fixed all boolean configuration values in the ASE (ARK: Survival Evolved) module. Booleans now correctly serialize as `True`/`False` (capitalized) instead of `true`/`false`, which ARK's INI parser requires.
            - **🗺️ ASA Genesis Part 1 Map**: Added Genesis Part 1 map support for ASA with the correct `map_id: "Genesis"`.
            - **⚙️ CI/CD Pipeline Rewrite**: Modernized the GitHub Actions build pipeline with automatic version extraction and reliable release publishing.
            </details>
            <details>
            <summary>v4.5.4 — Dino Spawn Editor, Loot Crate Editor & Guardian Watchdog</summary>

            - **🦖 Dino Spawn Editor**: Added visual control over creature spawn weighting and limits.
            - **🎁 Visual Loot Crate Editor**: Introduced a new visual editor to customize loot crate drops easily without touching raw INI files.
            - **👥 ASE Player Manager**: Complete pipeline for managing players in ARK: Survival Evolved (kick, ban, whitelist).
            - **🛡️ Mod Validator**: Added a robust Rust-based `mod_validator.rs` service for verifying mod file integrity.
            - **📈 Log Watcher Optimization**: Enhanced the background watcher to better detect RCON state changes and crash conditions.
            - **🛡️ Guardian Watchdog for ASA**: Integrated Guardian Watchdog settings into the ASA Scheduler UI.
            - **🤖 Intelligent Mode Auto-Escalation**: Guardian Watchdog now automatically escalates servers to Intelligent Repair mode when an infinite crash loop is detected.
            </details>
            <details>
            <summary>v4.5.3 — ASE Config Saving & RCON Fixes</summary>

            - **⚙️ Fixed ASE Config Page & Saving Issues**: Resolved serialization casing mismatches.
            - **🔧 INI Parser Multi-Line Continuation Fix**: Rewrote the INI parser's multi-line continuation logic for parenthesized overrides.
            - **💬 Added RCONServerLogBuffer Support**: Added full support for reading, writing, and editing the `RCONServerLogBuffer` configuration option.
            </details>
            <details>
            <summary>v4.5.2 — Custom Titlebar & Apple Window Controls</summary>

            - **🎨 Custom Frameless Title Bar**: Replaced the native OS title bar with a custom title bar featuring live server status, clock, and version.
            - **🍎 Apple-Style Traffic Light Controls**: macOS-inspired yellow, green, and red window buttons with hover/spring effects.
            - **🖱️ Native Drag & Double-Click**: Smooth dragging and double-click maximizing.
            - **🦕 DestroyWildDinos & Server Restart**: Added a quick "Wipe Wild Dinos" action.
            - **🧩 ASE Mod Loading Fixes**: Corrected mod ID injection into `GameUserSettings.ini` ActiveMods.
            </details>

            <details>
            <summary>v4.5.1 — ASE Support & Diagnostics Pipeline</summary>

            - **🦕 Full ASE Server Support**: Complete management pipeline for ASE servers including ShooterGameServer execution, config editor, map listings, and sidebar integration.
            - **🌐 Advanced Diagnostics Pipeline**: Real-time checks for process status, UDP port binding, LAN query (Steam A2S), and WAN accessibility.
            - **📂 Log Capture & Debugging**: Persistent logging to AppData `debug_events.log`.
            - **⚡ Layout Overhauls**: Optimized settings sliders, grids, and Config Editor layouts.
            </details>
          releaseDraft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'rc') }}
          includeUpdaterJson: true

      - name: Verify Release Signatures
        run: node scripts/verify-release-signatures.js
