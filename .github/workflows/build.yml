name: Build & Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      
      - name: Rust Cache
        uses: swatinem/rust-cache@v2.7.5
        with:
          workspaces: 'src-tauri -> target'
      
      - name: Install Dependencies
        run: npm ci
      
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0.5.15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ARK Server Manager ${{ github.ref_name }}'
          releaseBody: |
            ## 🚀 ${{ github.ref_name }} — Complete ASE Support & Automation Engine!

            This is a pre-release beta version containing major engine upgrades.

            ### 🦖 Complete ASE (Survival Evolved) Support Engine
            - Native integration of full server management, configs, scheduler, backup, and RCON consoles for ARK: Survival Evolved, fully parity-aligned with ASA.
            - Easy Game Switcher inside the sidebar to toggle between ASA and ASE management contexts.

            ### 💾 Save Management System & Timeline
            - Automated backup timeline and comparison dashboard tracking player counts, structure counts, file size, and tamed dinos.
            - Robust one-click interactive restore feature.

            ### ⚡ Server Automation & Sequential Boot Engine
            - Configurable sequential boot queues for multi-server setups to prevent CPU load spikes.
            - Global server startup recovery settings.

            ### 💻 Enterprise Organization Dashboard
            - A modern visual dashboard supporting drag-and-drop server hierarchy organization.
            - Cluster-aware automation, player notifications, and custom warning timers before server restarts.

            ### 🐕 Realtime Mod Manager & Watchdog
            - Automated CurseForge mod updates checking, mod status indicators, and clipboard-based bulk import upgrades.

            ### 🤖 Discord Bot Bridge Integration
            - Deep integration of the Discord Bot bridge for cross-chat relaying, automatic server alerts, and multi-server status reports.

            ### Install
            Download the `.msi` installer below.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          includeUpdaterJson: true

