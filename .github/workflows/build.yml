name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-2025
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
            echo "version=v${VERSION}" >> "$GITHUB_OUTPUT"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install Dependencies
        run: npm ci

      - name: Clean signing key
        shell: bash
        run: |
          CLEAN_KEY=$(echo -n "$RAW_KEY" | tr -d '\r\n ')
          echo "TAURI_SIGNING_PRIVATE_KEY=$CLEAN_KEY" >> $GITHUB_ENV
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0.5.15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ steps.version.outputs.version }}
          releaseName: 'ARK Server Manager ${{ steps.version.outputs.version }}'
          releaseBody: |
            ## 🚀 ARK Server Manager ${{ steps.version.outputs.version }}

            ### Installation
            - **Auto-Update**: If you already have the app installed, it will auto-detect this release and prompt you to update.
            - **Fresh Install**: Download the `.exe` installer below and run it.

            ### 🆕 New Features in v4.6.8
            - **🎨 Hardware Allocation UI/UX Overhaul**:
              - Redesigned the **Hardware Allocation** page with a modern dark glassmorphic interface, ambient neon glow, and live CPU telemetry header (logical cores, physical cores, and cluster core usage).
              - Added **Interactive One-Click Core Affinity Presets**: All Cores, Physical Cores Only (Even), Hyperthreads Only (Odd), OS Reserved (Skip Cores 0-1), First Half, and Second Half split.
            - **🧮 Live Hexadecimal & Binary Affinity Mask Calculator**:
              - Computes real-time Windows process affinity mask in Hexadecimal (`0x000000FF`) with 1-click **Copy Mask** to clipboard.
            - **🔍 Multi-Server Core Conflict Detector**:
              - Real-time cluster core inspection highlighting cores already shared with or assigned to other active servers (`Shared (N)` badge) to prevent thread contention.
            - **🛡️ Process Priority Cards & RealTime Safety Guard**:
              - Color-coded process priority selector cards (`Idle`, `BelowNormal`, `Normal`, `AboveNormal`, `High`, `RealTime`) with a safety warning confirmation modal when selecting `RealTime` priority to protect host OS stability.

            ### 🐛 Bug Fixes in v4.6.8
            - **🔧 RCON Scheduled Maintenance Warning Broadcasts**:
              - Fixed warning notifications by auto-sanitizing and double-quoting RCON message strings (`ServerChat "..."` and `Broadcast "..."`) for ARK ASA and ASE game servers.
            - **🔧 Tauri 2 State Access Fixes**:
              - Replaced direct tuple field access (`state.0`) with `.inner().0` across `commands/rcon.rs`, `services/scheduler.rs`, `services/mod_watchdog.rs`, `services/discord_bridge.rs`, and `services/ase_discord_bridge.rs`.
            - **🔧 Database Plugin Migration Foreign Key Repair**:
              - Fixed `Failed to update plugin state: no such table: main.servers_old` error by updating SQLite schema repair routines (`repair_broken_fks`) and adding in-line auto-repair fallback when toggling plugins.
            - **🔧 Hardware Core Selection Validation**:
              - Fixed `You must select at least one CPU core if not using all cores` validation error by auto-populating logical cores when unticking "Use All Cores" and auto-falling back safely during save.

            ### 🛠️ Previous Releases
            <details>
            <summary>v4.6.7 — Steam Auto-Update Engine, In-Game Broadcasts & Engram Editor Fixes</summary>

            - **⚡ Steam Auto-Update Engine with In-Game RCON Broadcasts**: Automated background monitoring of Steam Web API build IDs for ASA and ASE with 3-minute/1-minute warning broadcasts and automated server saves.
            - **⚙️ Per-Server Auto-Update & Update-on-Start Toggles**: Per-server toggle switches in server cards and Update Options dropdown menu.
            - **🎨 Redesigned Release Notes Modal**: Markdown parser rendering release text into styled headings, code badges, and tags with 1-click Copy Notes.
            - **📊 Interactive Engram Points Per Level Customizer**: Custom level-by-level engram points editor with Quick Generator.
            - **🔧 ASA Engram Points Per Level Saving Bug Fix**: Fixed `OverridePlayerLevelEngramPoints` line escaping.
            - **🔧 Backup Loop & Disk Space Fix**: Resolved 1-minute auto-backup execution loop with SQLite timestamp parser guard.
            </details>
            <details>
            <summary>v4.6.6 — 5-Tab Mod Inspector, Lightbox Gallery & Directory Explorer</summary>

            - **📦 Advanced Mod Details 5-Tab Inspector**: Overview & Description, Comments & Admin Notes, Files history, Gallery Lightbox, and Mod Relations.
            - **🖼️ Interactive Lightbox Gallery Viewer**: Keyboard shortcuts (`ArrowLeft`, `ArrowRight`, `Escape`), thumbnail strip, and full resolution preview.
            - **🧩 Installed Mods UI & Sync Overhaul**: Status filter tabs, Server Sync banner, and 1-click Copy Mod ID.
            - **📂 Real Server Directory Explorer Access**: 1-click Open Folder button directly opening server install directory in Windows Explorer.
            - **🔧 CurseForge Image Proxy Fix**: Resolved missing screenshots and blank images in Mod Review modal via backend proxying.
            - **🔧 Isolated Profile Name Persistence**: Profile display names (`displayName`) persist to SQLite without modifying or corrupting `GameUserSettings.ini` `SessionName`.
            </details>
            <details>
            <summary>v4.6.5 — Game Selection Redesign, Categories & Deep Repair Fixes</summary>

            - **🎨 Redesigned Game Selection Screen**: Clean, minimal, modern layout replacing the heavy tech-themed design.
            - **📂 Server Organization Categories Bar**: Category filter pills with server count badges on Server Manager.
            - **⚙️ Window Close Action in Settings**: Radio selectors for Always Ask, Minimize to System Tray, Exit Completely.
            - **🔧 Deep Repair Column Type & Duplicate Start Fixes**: Fixed SQLite column type crash and stale process detection.
            - **🔧 Dropdown Menu Stacking Fix**: Hierarchical z-index stacking on server cards.
            </details>
            <details>
            <summary>v4.6.4 — Automated Backups, Discord Bot Guide & Cluster Topology</summary>

            - **🐛 ASE Branch Switching Fix (preaquatica → Default/Latest)**: SteamCMD now explicitly receives `-beta public` to clear cached beta keys.
            - **💾 Automated Backup System**: Full backup system with customizable presets, timeline/grid/calendar views, and one-click restore.
            - **🔔 Application Close Confirmation & Reminder**: Modal with Minimize to Tray or Exit options, persistent preference checkbox.
            - **🔄 In-App Update Checker**: Compare current version against latest GitHub release with one-click install.
            - **🤖 Discord Bot Install Guide & Integration**: Step-by-step install guide modal for the Discord bot.
            - **💬 Cross-Chat & RCON Message Detection Improvements**: Overhauled RCON message detection for reliable cross-server chat relay.
            - **🌐 Cluster Topology Real Data Integration**: Live CPU%, RAM%, Player count/max, and Uptime refreshing every 10 seconds.
            - **🎨 UI/UX Design Improvements**: Redesigned Cluster Topology nodes, Discord Bot tabs, and Backups timeline view.
            </details>
            <details>
            <summary>v4.6.3 — Maintenance Overhaul, Mod Fixes & Plugin Manager</summary>

            - **🛠️ Automated Maintenance Sequence Overhaul**: Visual skipped steps, smart RCON polling, and instant abort feedback.
            - **📡 Dual-Store System Status Fix**: Accurate Online/Offline indicators across ASA and ASE modes.
            - **🛡️ Mod Startup Crash & Warnings Fix**: Mod ID "0" filter and false-positive warning suppression.
            - **🦖 Mod Manager Drag-and-Drop & Bulk Actions**: Full drag-and-drop reordering, Enable/Disable All.
            - **🎨 Premium UI Overhauls**: Full-width server hub, pill-shaped actions, pulsing spinners.
            - **🔌 Per-Server ASA Plugin Manager**: Plugin discovery, manifest parsing, and dependency validation.
            - **⚙️ API Loader & DLL Renaming**: Toggle between AsaApiLoader.exe and ArkAscendedServer.exe.
            - **📁 Custom SteamCMD Path Redirect**: Custom folder path with non-ASCII character validation.
            - **🧹 SteamCMD Cache Cleaning**: Process termination and stale appmanifest deletion.
            - **📱 Collapsible Sidebar**: Redesigned sidebar with tooltips and ASE support toggle.
            </details>
            <details>
            <summary>v4.6.1 — AI Co-Pilot Notification Center, Diagnostics & Toast Suppression</summary>

            - **🛡️ AI Co-Pilot Notification Center**: Unified crash notification center with in-memory caching, server-wide grouping/deduplication, sequential queue AI analysis, and historical archive modal.
            - **🌐 Diagnostics Reachability Fallback**: Integrated RCON TCP local connectivity checks and process manager startup confirmation to prevent Windows loopback firewall false-negatives.
            - **🧩 Optional CurseForge Mod Alerts**: Automatically suppresses all CFCore mod-loading warnings and crash notifications for plugins-only servers (with 0 enabled mods).
            - **🔕 Log Anomaly Toast Suppression**: Silences active server toast warnings for generic log anomalies (Crash, Fatal Error, Exception), caching them solely for post-crash diagnostic enrichment.
            </details>
            <details>
            <summary>v4.6.0 — Native C++ CrossChat, Chat Persistence & Real-Time Logs</summary>

            - **💬 Native C++ CrossChat Plugin (AsaApi)**: Introduced a native C++ plugin (`AsaCrossChat.dll`) for Ark Server API (AsaApi) enabling cross-server cluster chat sync via a shared MySQL/MariaDB database.
            - **⚡ Chat Persistence & Startup Safety**: Fixed the "lost chat messages on startup" bug.
            - **👁️ Real-Time Log Streaming Fixes**: Overhauled the log tailing engine to use parent directory monitoring.
            </details>
            <details>
            <summary>v4.5.5 — Overhauled Auto-Update System & ASE Config Fixes</summary>

            - **🔄 Rewritten Auto-Update System**: Completely overhauled the update checker with robust error handling, elevation detection, portable ZIP fallback, and direct download URLs.
            - **🦕 ASE Boolean Config Fix**: Fixed all boolean configuration values in the ASE module.
            - **🗺️ ASA Genesis Part 1 Map**: Added Genesis Part 1 map support for ASA.
            - **⚙️ CI/CD Pipeline Rewrite**: Modernized the GitHub Actions build pipeline.
            </details>
            <details>
            <summary>v4.5.4 — Dino Spawn Editor, Loot Crate Editor & Guardian Watchdog</summary>

            - **🦖 Dino Spawn Editor**: Added visual control over creature spawn weighting and limits.
            - **🎁 Visual Loot Crate Editor**: Introduced a new visual editor to customize loot crate drops.
            - **👥 ASE Player Manager**: Complete pipeline for managing players in ASE.
            - **🛡️ Mod Validator**: Rust-based `mod_validator.rs` service for verifying mod file integrity.
            - **🛡️ Guardian Watchdog for ASA**: Integrated Guardian Watchdog settings into the ASA Scheduler UI.
            - **🤖 Intelligent Mode Auto-Escalation**: Guardian Watchdog auto-escalates servers to Intelligent Repair mode on crash loops.
            </details>
            <details>
            <summary>v4.5.3 — ASE Config Saving & RCON Fixes</summary>

            - **⚙️ Fixed ASE Config Page & Saving Issues**: Resolved serialization casing mismatches.
            - **🔧 INI Parser Multi-Line Continuation Fix**: Rewrote the INI parser's multi-line continuation logic.
            - **💬 Added RCONServerLogBuffer Support**: Full support for reading, writing, and editing.
            </details>
            <details>
            <summary>v4.5.2 — Custom Titlebar & Apple Window Controls</summary>

            - **🎨 Custom Frameless Title Bar**: Custom title bar with live server status, clock, and version.
            - **🍎 Apple-Style Traffic Light Controls**: macOS-inspired window buttons with hover/spring effects.
            - **🦕 DestroyWildDinos & Server Restart**: Added a quick "Wipe Wild Dinos" action.
            - **🧩 ASE Mod Loading Fixes**: Corrected mod ID injection into `GameUserSettings.ini`.
            </details>
            <details>
            <summary>v4.5.1 — ASE Support & Diagnostics Pipeline</summary>

            - **🦕 Full ASE Server Support**: Complete management pipeline for ASE servers.
            - **🌐 Advanced Diagnostics Pipeline**: Real-time checks for process status, UDP port binding, LAN query, and WAN accessibility.
            - **📂 Log Capture & Debugging**: Persistent logging to AppData `debug_events.log`.
            - **⚡ Layout Overhauls**: Optimized settings sliders, grids, and Config Editor layouts.
            </details>
          releaseDraft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'rc') }}
          includeUpdaterJson: true

      - name: Verify Release Signatures
        run: node scripts/verify-release-signatures.js
