name: Build & Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
      
      - name: Install Dependencies
        run: npm ci
      
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ASA Server Manager ${{ github.ref_name }}'
          releaseBody: |
            ## 🔐 v2.3.4 — Password Corruption Hotfix & Advanced Config UI

            ### 🐛 Critical Bug Fix
            - **Password Corruption Fixed** — Admin Password no longer gets corrupted to `Admin123?ServerPassword=Ark123` on server startup
            - **Password Sanitization** — `ServerAdminPassword` and `ServerPassword` are now strictly isolated at config sync, INI generation, and startup argument layers
            - **Dynamic Password Clearing** — INI generator writes password fields unconditionally, allowing users to clear passwords
            - **Auto-Repair** — Existing corrupted passwords in the database are automatically detected and fixed on load

            ### ✨ New Features
            - **Password Masking UI** — Server Password and Admin Password fields now use masked input with Eye/EyeOff toggle
            - **Advanced Config Profile List** — Saved event profiles displayed in a selectable list with LIVE badge
            - **MultiplierSlider Component** — Custom slider with visual fill bar + inline numeric input
            - **Toast Feedback** — All Advanced Config save/toggle actions now show success/error notifications

            ### 🎨 UI Improvements
            - **Advanced Configuration Dashboard** — Complete UI rebuild with better layout and profile management
            - **Structure Overrides Tab** — Informative placeholder with redirect to Event Profiles

            ### Install
            Download the `.msi` installer below.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
