name: Build & Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-2025-vs2026
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
      
      - name: Install Dependencies
        run: npm ci
      
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ASA Server Manager ${{ github.ref_name }}'
          releaseBody: |
            ## 🚀 v2.3.6 — Hardware Isolation, Watchdog & Cloud Backups

            ### ⚡ Hardware Isolation Engine
            - **Core Affinity**: Bind server instances to specific CPU logical cores to eliminate OS thread migration overhead.
            - **High-Performance Scheduling**: Configurable Windows Process Priority settings for stable CPU cycles under load.

            ### 🐕 Mod Update Watchdog System
            - **Automated Monitoring**: Background worker monitors CurseForge for mod updates and handles server maintenance windows.

            ### ☁️ Advanced Cloud Backup Integration
            - **Disaster Recovery**: Direct synchronization and scheduled backups to enterprise cloud storage buckets.

            ### 💻 Interactive CPU Topology Grid
            - **Visual Mapping**: Dashboard mapping the host machine's physical and logical processors for server-affinity distribution.

            ### 🐛 Bug Fixes
            - **IPC Serialization Error**: Resolved invalid argument payload crash (`missing field serverId`) in the `save_hardware_allocation` Tauri command.
            - **TS Compilation Warnings**: Fixed unused getters and type mismatches in `hardwareStore.ts` and lazy-loading components in `App.tsx`.
            - **Cloud Backup Navigation**: Patched routing and permission bugs preventing access to the remote storage dashboard panel.

            ### Install
            Download the `.msi` installer below.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

