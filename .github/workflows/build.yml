name: Build & Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      
      - name: Rust Cache
        uses: swatinem/rust-cache@v2.7.5
        with:
          workspaces: 'src-tauri -> target'
      
      - name: Install Dependencies
        run: npm ci
      
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0.5.15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ARK Server Manager ${{ github.ref_name }}'
          releaseBody: |
            ## 🚀 ARK Server Manager ${{ github.ref_name }}

            This release brings complete Windows Defender Firewall automation to the ARK: Survival Evolved (ASE) side, a premium settings tabbed redesign, application-wide re-branding to ASM 2.0, raw configuration editing, visual color gradients, and critical bug fixes.

            ### ✨ What's New
            - **ASE Firewall Automation**: Full automated Windows Defender Firewall rules checking, creation (both UDP and TCP rules), batch assignments, and manual custom port configurations on the ASE Settings side.
            - **ASE Settings Tabbed Redesign**: Redesigned flat ASE settings into a modern, glassmorphic tabbed view containing General Paths, API Integrations, and Firewall Rules dashboards.
            - **ASM 2.0 Re-branding**: Re-branded all "Nexus" references to **ASM 2.0** within the support/donation banners and popup dialogues.
            - **Visual Color Presets & Custom Gradient Generator (ASE & ASA)**: Premium color dropper picker, automated hex-to-decimal color translator, and custom Gradient Text Builder (interpolating smooth letter-by-letter or bold word-by-word spreads) integrated directly inside MOTD editors.
            - **MOTD Relocation & Multi-line Expander**: Moved MOTD inputs to the **General** tab for immediate access and mapped them to multiline textarea fields with a real-time parsed broadcast preview panel.
            - **Raw INI Text Editor (ASE side)**: Toggle easily between visual and raw INI text editors with smooth sidebar expansion and disk-to-cache synchronization.
            - **Level Generator & Stat Multipliers Routing**: Sidebar selections automatically redirect active config tabs to `Game.ini` to guarantee correct context syncing.

            ### 🐛 Bug Fixes
            - **Mutagen Level Boost spelling fix**: Corrected spelling to `MutagenLevelBoost_Bred` (with underscore) across the visual editor schema and Rust INI parser, keeping backwards-compatible fallback logic.
            - **ASESettings Infinite Loop Fix**: Fixed a critical missing dependency array in the main ASE settings load effect that was causing infinite render loop cycles.

            ### Install
            Download the `.msi` or `.exe` installer below.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          includeUpdaterJson: true
