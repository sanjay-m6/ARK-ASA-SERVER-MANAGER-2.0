name: Build & Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
      
      - name: Install Dependencies
        run: npm ci
      
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ASA Server Manager ${{ github.ref_name }}'
          releaseBody: |
            ## 🚀 v2.3.0 — Config Hot-Reloading & Performance Tracking

            ### ✨ New Features
            - **Config Hot-Reloading**: Changes to the Config Editor now selectively update INI files array-by-array in real time instead of destroying the server's database configuration.
            - **Non-blocking Saves**: Running servers now prompt a smooth, dismissable "Restart Required" toast (complete with a dedicated `X` button) when configurations are updated, rather than automatically reloading via RCON.
            - **Enhanced Performance Metrics**: CPU metrics now dynamically poll Windows via a targeted process instead of refreshing all underlying system stats. Charts are fully rounded, and polling smoothly pulses every 10 seconds.

            ### 🐛 Bug Fixes
            - **Null CPU Usage Fixed**: The critical bug where CPU usage remained locked at `0%` due to a thread blocking flaw in the reporting framework has been resolved.
            - **Build Stability**: Eliminated conflict errors in `cargo run` setups by removing the test bin execution context.

            ### Install
            Download the `.msi` installer below.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
