name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-2025
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      
      - name: Rust Cache
        uses: swatinem/rust-cache@v2.9.1
        with:
          workspaces: 'src-tauri -> target'
      
      - name: Install Dependencies
        run: npm ci
      
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0.5.15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ARK Server Manager ${{ github.ref_name }}'
          releaseBody: |
            ## 🚀 ARK Server Manager ${{ github.ref_name }}

            This release includes the major v4.5.1 update integrating full ARK: Survival Evolved (ASE) server support and an advanced diagnostics pipeline, alongside the features introduced in the v4.5.0 release (custom config folders, RCON stability fixes, and settings deadlock mitigations).

            ### 🆕 New Features & Improvements in v4.5.1
            - **🦕 Full ARK: Survival Evolved (ASE) Support**: Complete management pipeline for ASE servers, including ShooterGameServer execution monitoring, environment layout configurations, in-app configuration editor pages, map listings, and seamless sidebar layout integration.
            - **🌐 Advanced Diagnostics Pipeline**: Real-time diagnostic verification system checks process status, UDP port binding availability, LAN query status (Steam A2S protocol), and global public WAN accessibility.
            - **🎓 Setup & Troubleshooting Guides**: Interactive troubleshooting dashboard built directly into the server status bar offering clear instructions to resolve local firewalls, port forwarding (NAT), and UPnP setup issues.
            - **📂 Log Capture & Failsafe Debugging**: Added persistent logging for installation stages, written directly to the user AppData directory (`debug_events.log`) for streamlined debugging.
            - **⚡ Layout Overhauls**: Optimized interactive settings sliders, grids, and UI layout on Config Editor and Infinity Damage pages.

            ### 🛠️ Key Previous Improvements & Fixes (v4.5.0)
            - **🗂️ Custom User Config Folder Override**: Point to custom folders containing server INI configuration files (GameUserSettings.ini, Game.ini) for both ASA and ASE. The manager reads/writes configs from this folder instead of the server install directory.
            - **🔒 RCON Tab Page Locking**: Resolved UI locking on the RCON console page by implementing stable Zustand state selectors and avoiding side-effects during render loops.
            - **🏷️ Server Name Saving & Migration**: Fixed server name saving on the ASA side (where names would revert to random default names like `ARK#824565` or old names persist) by migrating legacy `ServerName` references to `SessionName` and cleaning up obsolete config keys.
            - **🔄 Settings Loading Loop Fix**: Re-scoped SQLite DB connection lock acquisitions to small, synchronous blocks during INI read/write and startup configurations to prevent deadlocking Settings pages.
            - **❄️ CryoSickness PvP Toggle Option**: Added a native toggle under the visual PvP rules tab in ASE settings to enable or disable cryo sickness on PvP servers.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          includeUpdaterJson: true
