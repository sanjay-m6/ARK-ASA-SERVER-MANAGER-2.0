name: Build & Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      
      - name: Rust Cache
        uses: swatinem/rust-cache@v2.7.5
        with:
          workspaces: 'src-tauri -> target'
      
      - name: Install Dependencies
        run: npm ci
      
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0.5.15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ARK Server Manager ${{ github.ref_name }}'
          releaseBody: |
            ## 🚀 ${{ github.ref_name }} — Pre-Release Build

            This is a pre-release beta version for v2.4.2 containing stability fixes, UI enhancements, and organization layout fixes.

            ### ✨ What's New
            - **Concurrent Background Downloader**: Implemented Tauri background tasks for downloading and installing servers in parallel with automated state draft saving on minimize.
            - **Floating Install Center**: Added an interactive bottom-right widget to track concurrent installations, view details, and resume minimized setups.
            - **Unified "Engrams & Crafting" Tab**: Reorganized configurations so that global settings like Auto-Unlock, Unlimited Respecs, Item Stack Sizes, and Custom Recipes are editable directly in the main Engrams tab.
            - **Glassmorphic API Key Card**: Redesigned the global Steam Web API Key redirection card to be vertically centered, fully interactive/clickable, and responsive.
            - **AI Copilot Repositioning**: Moved the global AI Copilot FAB and Panel to the top-right to prevent UI overlapping with bottom-right panels.

            ### Install
            Download the `.msi` installer below.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          includeUpdaterJson: true
