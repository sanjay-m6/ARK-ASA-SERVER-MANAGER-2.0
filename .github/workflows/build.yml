name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-2025
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      
      - name: Rust Cache
        uses: swatinem/rust-cache@v2.9.1
        with:
          workspaces: 'src-tauri -> target'
      
      - name: Install Dependencies
        run: npm ci
      
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0.5.15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ARK Server Manager ${{ github.ref_name }}'
          releaseBody: |
            ## 🚀 ARK Server Manager ${{ github.ref_name }}

            This release introduces a fully custom frameless title bar with Apple-style window controls, ASE mod management improvements, and new server administration tools for both ASA and ASE.

            ### 🆕 New Features & Improvements in v4.5.2
            - **🎨 Custom Frameless Title Bar**: Replaced the native OS title bar with a fully custom, premium dark-themed title bar featuring live server status, clock display, game badge, and app version — all in a sleek gradient layout.
            - **🍎 Apple-Style Traffic Light Controls**: macOS-inspired minimize (yellow), maximize (green), and close (red) buttons with always-visible colors, spring-animated hover icons, and click-pulse ripple effects. Controls are positioned on the right side for easy access.
            - **🖱️ Native Drag & Double-Click**: Window dragging and double-click-to-maximize/restore handled natively via Tauri's `data-tauri-drag-region`, eliminating conflicts between JavaScript drag handlers and OS-level mouse capture.
            - **🦕 DestroyWildDinos & Server Restart**: Added a one-click "Wipe Wild Dinos" action (via RCON `DestroyWildDinos` cheat) with automatic server restart option, available in both ASA and ASE server management tabs.
            - **🧩 ASE Mod Loading Fixes**: Resolved issues where mods installed via the Mod Manager were not loading on ASE servers — corrected mod ID injection into `GameUserSettings.ini` ActiveMods line.
            - **📐 Enlarged Window Controls**: Traffic light buttons increased to 16px for better accessibility and easier click targets.

            ### 🛠️ Previous Releases
            <details>
            <summary>v4.5.1 — ASE Support & Diagnostics Pipeline</summary>

            - **🦕 Full ASE Server Support**: Complete management pipeline for ASE servers including ShooterGameServer execution, config editor, map listings, and sidebar integration.
            - **🌐 Advanced Diagnostics Pipeline**: Real-time checks for process status, UDP port binding, LAN query (Steam A2S), and WAN accessibility.
            - **🎓 Setup & Troubleshooting Guides**: Interactive troubleshooting dashboard for firewalls, port forwarding, and UPnP.
            - **📂 Log Capture & Debugging**: Persistent logging to AppData `debug_events.log`.
            - **⚡ Layout Overhauls**: Optimized settings sliders, grids, and Config Editor layouts.
            </details>

            <details>
            <summary>v4.5.0 — Custom Config Folders & RCON Fixes</summary>

            - **🗂️ Custom Config Folder Override**: Point to custom folders for server INI files.
            - **🔒 RCON Tab Page Locking Fix**: Stable Zustand selectors to prevent UI locking.
            - **🏷️ Server Name Saving & Migration**: Fixed `ServerName` → `SessionName` migration.
            - **🔄 Settings Loading Loop Fix**: Scoped SQLite lock acquisitions to prevent deadlocks.
            - **❄️ CryoSickness PvP Toggle**: Native toggle for cryo sickness on PvP servers.
            </details>
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          includeUpdaterJson: true
