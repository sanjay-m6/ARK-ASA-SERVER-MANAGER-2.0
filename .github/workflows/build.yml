name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-2025
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      
      - name: Rust Cache
        uses: swatinem/rust-cache@v2.9.1
        with:
          workspaces: 'src-tauri -> target'
      
      - name: Install Dependencies
        run: npm ci
      
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0.5.15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ARK Server Manager ${{ github.ref_name }}'
          releaseBody: |
            ## 🚀 ARK Server Manager ${{ github.ref_name }}

            This release includes critical bug fixes for process launching, server configurations, mod downloads, firewall automation, and advanced visibility diagnostics.

            ### 🛠️ Key Improvements & Fixes
            - **🚫 Suppress PowerShell Windows**: Spawning game servers and running check commands on Windows now uses `CREATE_NO_WINDOW` unconditionally, preventing flashing conhost consoles and popups.
            - **🗂️ Steam Library Discovery for ASE Mods**: Resolved the "no .mod file found" error by automatically querying the Steam registry and library configuration files to locate local client mod descriptors.
            - **🏷️ Preservation of Spaces in Server Name**: Removed redundant connection CLI arguments to prevent Unreal Engine from converting space characters into underscores (`_`) on ASA server boots.
            - **📊 Live Visibility Diagnostics**: Integrated a 4-step real-time diagnostics checker in the status bar covering: active processes, UDP port bindings, local LAN responsiveness (A2S), and global WAN visibility.
            - **🛡️ Smart Firewall Automation**: Rewrote the firewall rule configurator to perform read-only queries. If rules match, admin UAC checks are bypassed, prompting users only when changes are actually required.
            - **💡 In-Game Search Troubleshooting Guide**: Added a collapsible settings walkthrough next to the Server Manager page header, complete with an annotated in-game screenshot illustrating how to configure search parameters and filters.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          includeUpdaterJson: true
