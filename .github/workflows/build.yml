name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
            echo "version=v${VERSION}" >> "$GITHUB_OUTPUT"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install Dependencies
        run: npm ci

      - name: Clean signing key
        shell: bash
        run: |
          CLEAN_KEY=$(echo -n "$RAW_KEY" | tr -d '\r\n ')
          echo "TAURI_SIGNING_PRIVATE_KEY=$CLEAN_KEY" >> $GITHUB_ENV
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0.5.15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ steps.version.outputs.version }}
          releaseName: 'ARK Server Manager ${{ steps.version.outputs.version }}'
          prerelease: false
          releaseBody: |
            ## 🚀 ARK Server Manager ${{ steps.version.outputs.version }} (Latest Release)

            ### Installation
            - **Auto-Update**: If you already have the app installed, it will auto-detect this release and prompt you to update.
            - **Windows**: Download the `.exe` installer below.
            - **Linux Desktop**: Download the `.AppImage` or `.deb` package below (`chmod +x *.AppImage` to run).
            - **Linux Headless / CLI**: Run `curl -fsSL https://raw.githubusercontent.com/sanjay-m6/ARK-ASA-SERVER-MANAGER-2.0/main/scripts/install.sh | bash`

            ### 🆕 New Features & Improvements in v4.6.18
            - **🐕 Mod Update Watchdog Persistence & Auto-Recovery**:
              - Fixed an issue where the Mod Update Watchdog disabled itself upon exiting or restarting the application.
              - Added dedicated SQLite database table `mod_watchdog_settings` with automatic schema migrations.
              - Background watchdog worker now automatically loads saved watchdog settings on application startup and synchronizes state seamlessly.
            - **🎯 RCON Give Items Player UID / EOS ID Resolution**:
              - Fixed item spawning failure when using Player UID or EOS ID in RCON Console (`GiveItemToPlayer`).
              - Implemented recursive directory scanning across `SavedArks`, `SavedArksLocal`, and map subdirectories to locate player profile (`.arkprofile`) files.
              - Enhanced binary profile parsing to support both `PlayerDataID` and `PlayerID` properties, automatically resolving player UIDs and EOS IDs to their required 64-bit integer IDs.
            - **💾 RCON Verified Save Validation & Deep Search**:
              - Fixed save verification continually failing in RCON Console.
              - Enhanced `SaveValidationInfo` to include `integrity_ok` and `file_size_bytes` data properties.
              - Added recursive `.ark` save search across map subdirectories (`SavedArks/<Map_WP>`) to accurately verify save existence, freshness, and file size (> 1KB).
            - **⚙️ GameUserSettings.ini & Game.ini Visual Editor Cleanup**:
              - Removed Breeding Settings from `GameUserSettings.ini` schema (as breeding multipliers are strictly `Game.ini` settings), eliminating user confusion.
              - Removed Agricultural & Ecosystem and Loot Quality sections from `GameUserSettings.ini` schema.
              - Restructured `Spoilage & World Resources` and `Dino Feeding & Decay Rules` under `[ServerSettings]`, keeping valid settings such as `AllowRaidDinoFeeding`.
              - Added `Loot Quality` (`SupplyCrateLootQualityMultiplier`, `FishingLootQualityMultiplier`), `PoopIntervalMultiplier`, `AllowAnyoneBabyImprintCuddle`, and `DisableImprintDinoBuff` to `Game.ini` under `[/Script/ShooterGame.ShooterGameMode]`.
            - **🧹 Clean INI Generation**:
              - Fixed redundant INI generation where `SessionName=` appeared under `[ServerSettings]`; it now outputs cleanly only under `[SessionSettings]`.
              - Removed obsolete `MapName=` from `[ServerSettings]` as the map is defined via command-line arguments.
              - Removed deprecated `[URL]` section (`Port=...`, `QueryPort=...`) as `QueryPort` is deprecated in ASA and network ports are managed via command line.
            - **🚀 New ASA Launch Arguments Matrix**:
              - Added `-usestore`, `-converttostore`, and `-DoCustomCosmeticValidation` flags to the Launch Arguments preset matrix with one-click toggles and descriptions.
            - **💬 Cluster Cross-Chat & RCON Filtering**:
              - Added strict regex and prefix filtering to suppress HTTP responses, CurseForge API JSON data, Sentry error logs, and echo loops from broadcasting in RCON cross-server chat.
            - **🦖 Dino Spawn & NPCReplacements INI Syntax Resolution**:
              - Fixed duplicate key prefix serialization in `Game.ini` where dinosaur replacements were being written as `NPCReplacements=NPCReplacements=(FromClassName="...",ToClassName="...")`.
              - Updated `DinoSpawnEditor.tsx` and the INI parser engine to reliably format and parse clean, valid `NPCReplacements=(FromClassName="...",ToClassName="...")` entries.
            - **🌐 Cluster Creation & SQLite Validation Hardening**:
              - Resolved `UNIQUE constraint failed: clusters.name` error when recreating or linking pre-existing cluster directories.
              - Implemented automatic user profile fallback directory path resolution (`%USERPROFILE%/ASA_Clusters`) when unprivileged Windows accounts are restricted from creating root `C:\` directories.
              - Added detailed, descriptive toast error alerts across `ClusterManager.tsx` and `ASEClusterManager.tsx` instead of generic masking.
            - **👑 In-Game Admin Management & Privilege Setup Modal**:
              - Built dedicated `InGameAdminModal.tsx` accessible from the sidebar and server controls to provide fast setup for in-game administrator privileges (`enablecheats`, `admincheat`, etc.) with one-click clipboard copying and step-by-step console instructions.
            - **🩺 Crash Doctor & Post-Update Recovery Suite**:
              - Integrated diagnostic crash recovery to handle instant 1–2s crashes following major Unreal Engine 5 game updates caused by outdated proxy DLL hooks (`version.dll`, `dxgi.dll`, `winhttp.dll`) and stale CFCore mod cache folders.
              - Added Safe Mode startup options and automated DLL integrity scanning.
            - **🛡️ Rust Backend Discord Warnings & Status Cleanup**:
              - Resolved unused imports and deprecation warnings in `discord.rs` and backend command handlers.

            ### 🛠️ Previous Releases
            <details>
            <summary>v4.6.17 — Mod Map Resolution, Discord Setup Fix & Parameter Sync</summary>

            - **🗺️ Fixed Mod Map Auto-Injection Bug & Svartalfheim Loading**:
              - Fixed hardcoded typo in the map lookup registry where Svartalfheim was incorrectly mapped to `927083` (the Turkey Trial holiday event mod) instead of `962796` (Svartalfheim Premium).
              - Implemented dynamic mod map resolution (`resolve_map_mod_id`) to automatically detect whether Svartalfheim Premium (`962796`) or Free (`893657` / `927084`), Forglar Premium (`952876`) or Free (`945244`), Amissa (`965379`), Insaluna (`935639`), etc. is installed.
              - Added automated sanitization on server boot to purge stale `ActiveMapMod=927083` and duplicate legacy keys (`ActiveModMap`, `ActiveMapMods`) from `GameUserSettings.ini`.
            - **🤖 Discord Bot Setup Crash Resolution (`UserId::new(0)`)**:
              - Resolved application panic and crash (`Attempted to call UserId::new with invalid (0) value`) when setting up Discord integration.
              - Authenticated the bot token upfront using `http.get_current_user().await` to obtain the valid Discord Snowflake `UserId` for channel permission overwrites.
            - **⚡ Real-Time Boot Launch Parameters Synchronization**:
              - Fixed state comparison in `serverStore.ts` and `aseServerStore.ts` by replacing shallow property comparisons with full deep object comparisons.
              - Saved launch arguments and configuration changes now update immediately in the UI without requiring navigation or tab switches.
            - **🔌 Clean Network Port Command Line Generation**:
              - Removed duplicate lowercase/PascalCase flags (`-port`/`-Port`, `-queryport`/`-QueryPort`, `-peerport`/`-PeerPort`) from ASA and ASE server launch commands to keep startup arguments clean, optimized, and compliant with Unreal Engine 5 standards.
            - **🛡️ ASA Server API Plugin Status & Port Binding Enhancement**:
              - Enhanced process detection with port-based command line matching and Windows verbatim path normalization (`\\?\`) to ensure accurate "Running" / "Online" detection when using `AsaApiLoader.exe`.
            </details>
            <details>
            <summary>v4.6.16 — Global UI/UX Tokenization & Custom Theme Studio</summary>

            - **🎨 Global UI/UX Tokenization & Design System Alignment**:
              - Completely refactored all hardcoded color classes across the entire application to use standardized dynamic CSS design tokens (`--surface`, `--surface-hover`, `--surface-active`, `--bg-primary`, `--border`, `--border-hover`, `--text-primary`, `--text-secondary`, `--text-muted`, `--accent`, `--accent-hover`, `--glow`).
              - Overhauled `Scheduler.tsx` (Presets, 5-step automation workflow, Watchdog card, task cards, 2-column modal, delete confirmation).
              - Overhauled `Backups.tsx` (Timeline & List views, target scope chips, dropdowns, file preview panel).
              - Overhauled `ASERconConsole.tsx` (Quick commands dock, terminal stream panels) and core UI modal components.
            - **🌈 10 Curated Theme Presets & Interactive Custom Theme Studio**:
              - Expanded built-in theme presets: **Aurora Dark** (Default), **Midnight Blue** (Enterprise), **Cyber Neon** (Futuristic), **Arctic Light** (High Readability), **Forest Emerald** (Bio-Ark), **Obsidian Purple** (Mystic), **Crimson Ember** (Volcanic), **Synthwave Sunset** (Retro 80s), **Solar Amber** (Desert Gold), and **Matrix Terminal** (Cyber Pro).
              - Added a full-featured **Custom UI Theme Studio** allowing users to customize Base Mode (Dark/OLED/Light), Primary & Secondary Accent Colors with interactive pickers and Hex support, Background Tint, Glassmorphism Surface Style, and Border Glow Intensity.
              - Added 8 Quick Inspiration Presets and a live interactive Desktop UI Simulator preview.
              - Custom theme configuration import/export via JSON and one-click reset to defaults.
            - **🌐 Comprehensive Internationalization (13 Global Locales) & TopBar Switcher**:
              - Fully activated all 13 supported languages: English (`en`), German (`de`), French (`fr`), Spanish (`es`), Italian (`it`), Portuguese - Brazil (`pt-BR`), Russian (`ru`), Turkish (`tr`), Japanese (`ja`), Korean (`ko`), Simplified Chinese (`zh-CN`), Traditional Chinese (`zh-TW`), and Tamil (`ta`).
              - Built a dedicated theme-adaptive `LanguageSettings.tsx` management screen with live search filtering, native flags, active status indicators, and real-time translation for both ASA and ASE Settings.
              - Added a Quick Language Selector dropdown menu to `TopBar.tsx` for instant 1-click language switching from anywhere in the application.
              - Multi-layer language persistence via `localStorage` and Tauri database (`app_language`) with automatic restore on launch.
            - **🪟 Maximized Window & Header Optimization**:
              - Fixed frameless window titlebar controls and maximize state handling.
              - Resolved layout overflow and modal responsiveness across all resolutions.
            </details>
            <details>
            <summary>v4.6.15 — ASA Server Restart & Scheduled Maintenance Stabilization</summary>

            - **🔄 ASA Server Restart & Scheduled Maintenance Stabilization**: Fixed server restart and maintenance shutdown crash misclassifications (Unreal Engine 5 exit codes `3`, `0`, and `1`), suppressed false-positive Discord crash alerts during intentional maintenance, and added synchronous stop-and-wait polling.
            - **⚙️ ASE Configuration Save & Unified UTF-8 Encoding Pipeline**: Fixed intermittent ASE configuration save errors by implementing flexible serde aliases and case-insensitive fallback mapping in `write_ase_config`, with UTF-8 BOM/UTF-16 normalization.
            - **🛡️ Scheduler Debounce & Watchdog Optimization**: Added debounce tracking to prevent duplicate scheduled restart triggers.
            </details>
            <details>
            <summary>v4.6.14 — Bjarnheim Map, Linux Headless Installer & Terminal Overhaul</summary>

            - **🗺️ Bjarnheim Map Integration (ASA)**: Added official mod map support for **Bjarnheim** (`Bjarnheim_WP`, CurseForge Mod ID `1376189`) with auto-injection of `-mods=1376189`.
            - **🐧 Linux Headless Daemon & CLI Installer**: Added `scripts/install.sh` for one-line automated installation of the headless CLI daemon (`asa_manager`).
            - **📊 Logs & RCON Console UI/UX Overhaul**: Redesigned glassmorphic terminal interface with syntax-highlighted log levels, search term highlights, line numbers, word-wrap toggles, and RCON quick action dock.
            - **⚙️ Fixed ASA & ASE Server Settings Resetting on Save/Return**: Resolved INI file parsing encodings and schema bridging.
            </details>
            <details>
            <summary>v4.6.13 — Knowledge Base Redesign & Discord Bridge</summary>

            - **📚 Knowledge Base & Documentation Reader Overhaul**: Complete redesign of the Knowledge Base with categorized technical guides, code blocks with 1-click copy, and styled alert callouts.
            - **💬 Realtime Discord Bridge & Chat Composer**: Redesigned chat composer interface in `DiscordHub.tsx` with segmented target picker (Both, Discord, Game).
            - **⚡ High CPU Usage & Background Process Optimization**: Refactored `ProcessManager` monitoring loop to use targeted single-PID updates and added 60s disk IO caching.
            </details>
            <details>
            <summary>v4.6.12 — Timed Graceful Shutdown, Custom Mod Folders & 4-Chart Telemetry</summary>

            - **⏳ Timed Graceful Shutdown System**: Full timed shutdown system with configurable countdown timer, in-game RCON broadcast announcements, optional world save before shutdown, and real-time countdown banner on server cards.
            - **📂 Custom Mod Categories & Folders System**: Create, edit, and organize custom mod folders in ASA & ASE Mod Managers with live mod count badges and category filtering.
            - **📈 4-Chart Telemetry Suite**: Real-time performance monitor tracking CPU, RAM, Player Concurrency, and Disk/IO metrics.
            </details>
            <details>
            <summary>v4.6.11 — Copy Player ID, World Save Notification Suppression & Launch Parameter Fixes</summary>

            - **📋 Copy Player ID Quick Action**: Added quick click-to-copy Player ID / SteamID / EOS ID buttons and interactive copy feedback to ASA and ASE RCON Consoles and Player Manager.
            - **🔕 Disable World Save Chat Notifications Option**: Added automated log & chat pattern filtering for `World Save Complete` system messages and cluster cross-chat toggle.
            - **🔧 Boot Launch Parameters Parameter Deserialization & Persistence**: Fixed Tauri IPC payload deserialization bug for launch argument toggles.
            </details>
            <details>
            <summary>v4.6.10 — Native Linux Support, Cross-Chat Map Aliases & RCON Loopback Fixes</summary>

            - **🐧 Native Cross-Platform Linux Support**: Complete platform abstraction architecture (`src-tauri/src/platform/`) supporting Windows and Linux natively.
            - **🏷️ Cluster Cross-Chat Map & Server Display Names**: Custom map alias settings in Cluster Cross-Chat configuration (`CrossChatConfigDialog`).
            - **🔧 RCON Local Loopback Fallback Fix**: Resolved `Connection Refused (os error 10061)` with automatic `127.0.0.1` local loopback fallback.
            - **🔧 Scheduled Maintenance Warning Countdown Fix**: In-game warning notifications at 30, 15, 10, 5, and 1 minute intervals.
            </details>
            <details>
            <summary>v4.6.9 — Launch Tags, PC-Only Enforcement & Backup Loop Fixes</summary>

            - **🏷️ Interactive Launch Arguments Tag Editor**: Introduced chip tags with 1-click removal (`[X]`), category filters, and active indicators in `AdvancedPage`.
            - **📣 ASA RCON Broadcast In-Game Fix**: Dual-dispatches RCON announcements to both `ServerChat` and `Broadcast`.
            - **🔒 Default PC-Only Enforcement**: Injects `-UseServerPCOnly` when crossplay is disabled.
            - **⚡ Non-Blocking Pre-Warning Countdown Engine**: Async warning countdowns in tokio tasks.
            </details>
            <details>
            <summary>v4.6.8 — Hardware Allocation UI/UX Overhaul & RCON Broadcast Fixes</summary>

            - **🎨 Hardware Allocation UI/UX Overhaul**: Redesigned Hardware Allocation page with modern dark glassmorphic interface and live CPU telemetry header.
            - **🧮 Live Hexadecimal & Binary Affinity Mask Calculator**: Real-time process affinity mask calculator with 1-click Copy.
            - **🔍 Multi-Server Core Conflict Detector**: Cluster core inspection highlighting cores already shared with active servers.
            - **🛡️ Process Priority Cards & RealTime Safety Guard**: Color-coded priority selector cards with safety confirmation modal.
            - **🔧 RCON Scheduled Maintenance Warning Broadcasts**: Double-quoting RCON message strings for ASA and ASE servers.
            - **🔧 Database Plugin Migration Foreign Key Repair**: SQLite schema repair routines and auto-repair fallback when toggling plugins.
            </details>
            <details>
            <summary>v4.6.7 — Steam Auto-Update Engine, In-Game Broadcasts & Engram Editor Fixes</summary>

            - **⚡ Steam Auto-Update Engine with In-Game RCON Broadcasts**: Automated background monitoring of Steam Web API build IDs for ASA and ASE with 3-minute/1-minute warning broadcasts and automated server saves.
            - **⚙️ Per-Server Auto-Update & Update-on-Start Toggles**: Per-server toggle switches in server cards and Update Options dropdown menu.
            - **🎨 Redesigned Release Notes Modal**: Markdown parser rendering release text into styled headings, code badges, and tags with 1-click Copy Notes.
            - **📊 Interactive Engram Points Per Level Customizer**: Custom level-by-level engram points editor with Quick Generator.
            - **🔧 ASA Engram Points Per Level Saving Bug Fix**: Fixed `OverridePlayerLevelEngramPoints` line escaping.
            - **🔧 Backup Loop & Disk Space Fix**: Resolved 1-minute auto-backup execution loop with SQLite timestamp parser guard.
            </details>
            <details>
            <summary>v4.6.6 — 5-Tab Mod Inspector, Lightbox Gallery & Directory Explorer</summary>

            - **📦 Advanced Mod Details 5-Tab Inspector**: Overview & Description, Comments & Admin Notes, Files history, Gallery Lightbox, and Mod Relations.
            - **🖼️ Interactive Lightbox Gallery Viewer**: Keyboard shortcuts (`ArrowLeft`, `ArrowRight`, `Escape`), thumbnail strip, and full resolution preview.
            - **🧩 Installed Mods UI & Sync Overhaul**: Status filter tabs, Server Sync banner, and 1-click Copy Mod ID.
            - **📂 Real Server Directory Explorer Access**: 1-click Open Folder button directly opening server install directory in Windows Explorer.
            - **🔧 CurseForge Image Proxy Fix**: Resolved missing screenshots and blank images in Mod Review modal via backend proxying.
            - **🔧 Isolated Profile Name Persistence**: Profile display names (`displayName`) persist to SQLite without modifying or corrupting `GameUserSettings.ini` `SessionName`.
            </details>
            <details>
            <summary>v4.6.5 — Game Selection Redesign, Categories & Deep Repair Fixes</summary>

            - **🎨 Redesigned Game Selection Screen**: Clean, minimal, modern layout replacing the heavy tech-themed design.
            - **📂 Server Organization Categories Bar**: Category filter pills with server count badges on Server Manager.
            - **⚙️ Window Close Action in Settings**: Radio selectors for Always Ask, Minimize to System Tray, Exit Completely.
            - **🔧 Deep Repair Column Type & Duplicate Start Fixes**: Fixed SQLite column type crash and stale process detection.
