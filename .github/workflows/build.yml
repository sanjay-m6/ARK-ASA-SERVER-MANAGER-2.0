name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
            echo "version=v${VERSION}" >> "$GITHUB_OUTPUT"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install Dependencies
        run: npm ci

      - name: Clean signing key
        shell: bash
        run: |
          CLEAN_KEY=$(echo -n "$RAW_KEY" | tr -d '\r\n ')
          echo "TAURI_SIGNING_PRIVATE_KEY=$CLEAN_KEY" >> $GITHUB_ENV
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0.5.15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ steps.version.outputs.version }}
          releaseName: 'ARK Server Manager ${{ steps.version.outputs.version }}'
          prerelease: false
          # Note: GitHub Actions limits expressions to 21,000 characters. Keep only the current release
          # and immediate prior release in releaseBody; historical changelogs are in CHANGELOG.md.
          releaseBody: |
            ## 🚀 ARK Server Manager ${{ steps.version.outputs.version }} (Latest Release)

            ### Installation
            - **Auto-Update**: If you already have the app installed, it will auto-detect this release and prompt you to update.
            - **Windows**: Download the `.exe` installer below.
            - **Linux Desktop**: Download the `.AppImage` or `.deb` package below (`chmod +x *.AppImage` to run).
            - **Linux Headless / CLI**: Run `curl -fsSL https://raw.githubusercontent.com/sanjay-m6/ARK-ASA-SERVER-MANAGER-2.0/main/scripts/install.sh | bash`

            ### 🆕 New Features & Bug Fixes in v4.6.27
            - **🛡️ Fix Server Startup Failure on Restarts & Port Release Engine (Exit Code 0)**:
              - Resolved critical issue where servers failed to start back up after scheduled morning/afternoon restarts or manual reboots, shutting down immediately upon startup with exit code 0.
              - Implemented process termination wait (`WaitForSingleObject`) with forceful `taskkill /F /T` fallback to guarantee old processes have completely terminated before launching new instances.
              - Added socket cleanup engine (`kill_processes_on_ports`) on game port (7777), query port (27015), and RCON port (27020) to eliminate lingering UDP/TCP socket holds in Windows network tables (`TIME_WAIT`/closing).
              - Added active port availability polling prior to server binary spawning, preventing Unreal Engine dedicated servers from aborting due to port contention.
              - Protected Guardian Watchdog state machine so terminating restart processes do not falsely overwrite starting/running servers with `stopped`.
              - Offloaded scheduler restart routines and player warning countdowns into asynchronous background tasks (`tauri::async_runtime::spawn`), preventing minute-by-minute countdown sleeps from freezing the scheduler ticker.
              - Fixed scheduled restart task routing to accurately distinguish between ASE and ASA servers, executing appropriate RCON commands and engine-specific launch sequences.
            - **📡 Discord Webhook Reliability & HTTP 429 Rate-Limit Auto-Retry**:
              - Resolved intermittent and dropped Discord notifications during server maintenance and restart cycles.
              - Implemented automatic retry mechanism (up to 4 attempts) on HTTP 429 `Too Many Requests` with exponential backoff honoring Discord's `Retry-After` header and body.
              - Updated server name resolution (`get_server_name`) to support both ASA (`servers`) and ASE (`ase_servers`) tables so server titles in Discord embeds are always accurate.
            - **🦅 Automatic Flier Riding Setting (`bForceCanRideFliers`)**:
              - Automatically preserves and defaults `bForceCanRideFliers=True` whenever General Settings are saved or modified, decoupling it from cave flyer restrictions and ensuring flying mounts remain mountable across all supported maps.

            ### 🛠️ Previous Releases
            <details>
            <summary>v4.6.26 — Server Startup Configuration Synchronization & Fatal Hang Protection</summary>

            - **🛡️ Fix Server Startup Configuration Vanishing & Resetting**:
              - Resolved critical bug where custom server configurations (SessionName, ServerPassword, ports, player limits, and custom multipliers) vanished and reverted back to original factory defaults on server start.
              - Added pre-launch INI synchronization (`sync_server_from_ini_if_changed`) to ensure manual or visual editor settings are absorbed into SQLite prior to startup config generation.
              - Introduced disambiguated type-safe config generation (`generate_config_for_type`) to eliminate SQLite ID collisions between ASA (`servers`) and ASE (`ase_servers`) tables.
              - Guarded custom template folder copying (`ase_user_config_folder`) so that existing `GameUserSettings.ini` and `Game.ini` are never overwritten on server boot.
              - Preserved manual `ActiveMods` and custom mod map keys (`ActiveMapMod`) during startup config generation.
            - **⚡ Fix UE4 Fatal Error Startup Hang Crash (`FHangThreadWatcher::HangeDetected()`)**:
              - Resolved fatal error crash dialog (`ShooterGameServer.exe!FHangThreadWatcher::HangeDetected() [gameengine.cpp:172]`) during server startup on Wine, Proton, Linux AppImage, and modded servers.
              - Unconditionally passed `-NoHangDetection` on dedicated server startup, preventing Unreal Engine 4's watchdog thread from aborting during asset/mod loading and flushing uninitialized in-memory defaults to disk.
              - Defaulted `no_hang_det` to `true` in configuration models, UI controls, and INI parsers.
            - **🐧 Linux & Wine Config Subdirectory Resolution**:
              - Updated `get_config_subdirectory` to dynamically verify whether Windows binaries (`ShooterGameServer.exe`) or `Saved/Config/WindowsServer` folders exist before falling back to `LinuxServer`.
              - Ensures servers executed under Wine/Proton on Linux (including AppImage environments) read and write to `WindowsServer/` where the Windows executable expects them.
            - **🔌 Fix RCON Loopback Binding & Connection (`WSAEADDRNOTAVAIL 10049`)**:
              - Fixed RCON connection failure when pressing the "Connect" button in the RCON Console.
              - Resolved inverted `0.0.0.0` address filtering, automatically mapping wildcards (`0.0.0.0`, `""`, `localhost`) to loopback target `127.0.0.1:<port>`.
              - Added defense-in-depth normalization in `ArkRconClient::connect`, background heartbeat loops, and RCON Console UI to guarantee `TcpStream::connect` never receives an illegal wildcard bind address.
            </details>

            *For full release notes of previous versions, please visit the [Releases Archive](https://github.com/sanjay-m6/ARK-ASA-SERVER-MANAGER-2.0/releases) or see [CHANGELOG.md](https://github.com/sanjay-m6/ARK-ASA-SERVER-MANAGER-2.0/blob/main/CHANGELOG.md).*
          releaseDraft: false
          includeUpdaterJson: true

      - name: Verify Release Signatures
        run: node scripts/verify-release-signatures.js
