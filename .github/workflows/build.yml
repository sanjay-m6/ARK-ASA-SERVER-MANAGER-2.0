name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_BUILD_JOBS: 2

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Free up space on C: drive by removing heavy unneeded SDKs
          Remove-Item -Recurse -Force "C:\Android" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\hostedtoolcache\windows\Java" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\hostedtoolcache\windows\Ruby" -ErrorAction SilentlyContinue

      - name: Configure Windows Pagefile
        if: runner.os == 'Windows'
        uses: al-cheb/configure-pagefile-action@v1.5
        with:
          minimum-size: 8GB
          maximum-size: 16GB
          disk-root: "C:"

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
            echo "version=v${VERSION}" >> "$GITHUB_OUTPUT"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install Dependencies
        run: npm ci

      - name: Clean signing key
        shell: bash
        run: |
          CLEAN_KEY=$(echo -n "$RAW_KEY" | tr -d '\r\n ')
          echo "TAURI_SIGNING_PRIVATE_KEY=$CLEAN_KEY" >> $GITHUB_ENV
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0.5.15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          CARGO_BUILD_JOBS: 2
          NODE_OPTIONS: "--max_old_space_size=4096"
        with:
          tagName: ${{ steps.version.outputs.version }}
          releaseName: 'ARK Server Manager ${{ steps.version.outputs.version }}'
          prerelease: false
          # Note: GitHub Actions limits expressions to 21,000 characters. Keep only the current release
          # and immediate prior release in releaseBody; historical changelogs are in CHANGELOG.md.
          releaseBody: |
            ## 🚀 ARK Server Manager ${{ steps.version.outputs.version }} (Latest Release)

            ### Installation
            - **Auto-Update**: If you already have the app installed, it will auto-detect this release and prompt you to update.
            - **Windows**: Download the `.exe` installer below.
            - **Linux Desktop**: Download the `.AppImage` or `.deb` package below (`chmod +x *.AppImage` to run).
            - **Linux Headless / CLI**: Run `curl -fsSL https://raw.githubusercontent.com/sanjay-m6/ARK-ASA-SERVER-MANAGER-2.0/main/scripts/install.sh | bash`

            ### 🆕 New Features & Bug Fixes in v4.6.31
            - **⚛️ Fix React Error #310 in Server Overview Modal**:
              - Resolved fatal `Minified React error #310` ("Rendered more hooks than during the previous render") when clicking *View Full Server Overview & Details* in Server Manager editing target menu.
              - Lifted `useServerStore` and `useAseServerStore` hooks to the top level of `ServerOverviewModal` before conditional return checks, ensuring hook execution order remains invariant across render passes.
            - **🔗 Fix Release Asset Download & Rollback URL Alignment (`ARK.Server.Manager`)**:
              - Fixed stale download URLs in `UpdateChecker.tsx` and `src-tauri/src/commands/system.rs` pointing to non-existent `ASA.Server.Manager_${version}_x64-setup.exe` (resulting in HTTP 404).
              - Aligned all manual fallback and rollback links to canonical GitHub release binary naming `ARK.Server.Manager_${version}_x64-setup.exe`.
            - **🛡️ Guardian Watchdog Crash Auto-Restart Resilience**:
              - Hardened auto-restart retry loop to gracefully handle transient startup failures following unexpected server exits.

            ### 🛠️ Previous Releases
            <details>
            <summary>v4.6.30 — Fix Staggered Scheduled Restarts, ASE Port Collisions, Gen1 & SQLite Corruption Healing</summary>

            - **⏰ Fix Staggered Scheduled Restarts Skipping Subsequent Maps (Extinction, Gen1, Valguero)**:
              - Resolved critical issue where staggered morning/afternoon restarts successfully restarted the first servers (Astraeos and The Island) but skipped subsequent maps.
              - Offloaded all server maintenance execution chains to asynchronous background tasks via `tauri::async_runtime::spawn`.
            - **🛡️ Fix ASE Port 7778 Collision & Instant Exit (Code 0) on The Island & Valguero**:
              - Resolved issue where ASE servers terminated immediately upon launch or restart with exit code 0 (`STATUS_SUCCESS`). Added UDP 7778 PeerPort tracking and cleanup.
            - **🗺️ Fix Gen1 (Genesis Part 1) Failing to Start & Official Map Normalization**:
              - Normalized map names in `AseLauncher` and `config_generator.rs` (`Genesis_WP` and `Genesis2_WP`).
            - **💾 Fix Astraeos Database Corruption & Automatic SQLite Healing (`FAtlasSaveManager`)**:
              - Automated SQLite integrity check and corrupted database recovery before launch.
            - **🛡️ Fix Guardian Watchdog Self-Healing & Crash Recovery**:
              - Restored watchdog crash recovery and self-healing for taskkill and unexpected exits.
            </details>

            - **🛡️ Fix Multi-Server / Cluster Process Hijacking & Cross-Server Crashes**:
              - Resolved critical issue where starting a cloned or clustered server (e.g. Scorched Earth sharing install directory or parent paths with The Island) caused Server Manager to falsely adopt the running PID for other servers, displaying both as running and causing one to crash/terminate when the other was stopped.
              - Enforced strict process exclusivity across the process manager: a single OS PID can never be assigned or adopted by more than one server instance in memory.
              - Rewrote `find_game_server_pid_by_install_path` to strictly match by unique network ports (`query_port` and `game_port` via command line and UDP listening sockets) whenever ports are configured, eliminating fallback to ambiguous install directory matching for multi-instance deployments.
              - Added `exclude_pids` enforcement across periodic process adoption monitoring, startup recovery, Guardian Watchdog, and status checks so active server PIDs are never claimed by another server profile.
              - Scoped `show_server_window` strictly to the targeted server PID and its direct child process, removing indiscriminate global window un-hiding that forced other servers' console windows to show.
            </details>

            *For full release notes of previous versions, please visit the [Releases Archive](https://github.com/sanjay-m6/ARK-ASA-SERVER-MANAGER-2.0/releases) or see [CHANGELOG.md](https://github.com/sanjay-m6/ARK-ASA-SERVER-MANAGER-2.0/blob/main/CHANGELOG.md).*
          releaseDraft: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Verify Release Signatures
        run: node scripts/verify-release-signatures.js
