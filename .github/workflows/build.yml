name: Build & Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      
      - name: Rust Cache
        uses: swatinem/rust-cache@v2.7.5
        with:
          workspaces: 'src-tauri -> target'
      
      - name: Install Dependencies
        run: npm ci
      
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0.5.15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ARK Server Manager ${{ github.ref_name }}'
          releaseBody: |
            ## 🚀 ${{ github.ref_name }} — Pre-Release Build

            This is a pre-release beta version for v2.4.1 containing stability fixes and UI enhancements.

            ### ✨ What's New
            - **ASE Modern Config Editor**: Redesigned UI configuration editor for ASE servers with a tabbed interface.
            - **Database Migrations Fixed**: Fixed a critical crash during database migration and foreign key repair that prevented the app from starting up properly.
            - **UI Refinements**: Migrated native browser confirm popups to beautifully styled custom dialog components.

            ### Install
            Download the `.msi` installer below.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          includeUpdaterJson: true

