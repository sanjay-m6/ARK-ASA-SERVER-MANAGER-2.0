name: Build & Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
      
      - name: Install Dependencies
        run: npm ci
      
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ASA Server Manager ${{ github.ref_name }}'
          releaseBody: |
            ## 🚀 v2.3.5 — Infinity AI, Visual Clusters, and Community Tools

            ### 🤖 Infinity AI Assistant
            - **Autonomous Agent**: Integrated NVIDIA-powered Infinity AI assistant for advanced server management via natural language.
            - **Secure Execution**: AI destructive actions require user confirmation through a robust tool-calling framework.

            ### 🌍 Visual Cluster Builder
            - **Drag-and-Drop Mapping**: Build and manage multi-server cross-ARK configurations visually with node-based connections.

            ### 👥 Community & Points System
            - **Support Tickets**: Players can submit tickets via Discord, managed directly within the app.
            - **Player Points**: Easily modify player balances directly from the manager for community events.

            ### 🛠️ New Tools
            - **Tribe Log Viewer**: Native parsing and viewing of active tribe logs.
            - **UPnP Panel**: Simplify automatic port mapping and routing troubleshooting.

            ### 🗺️ New Map Support
            - Added Amissa, Insaluna, Reverence, Svartalfheim, and Temptress Lagoon.

            ### Install
            Download the `.msi` installer below.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
