name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_BUILD_JOBS: 2

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Free up space on C: drive by removing heavy unneeded SDKs
          Remove-Item -Recurse -Force "C:\Android" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\hostedtoolcache\windows\Java" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\hostedtoolcache\windows\Ruby" -ErrorAction SilentlyContinue

      - name: Configure Windows Pagefile
        if: runner.os == 'Windows'
        uses: al-cheb/configure-pagefile-action@v1.5
        with:
          minimum-size: 8GB
          maximum-size: 16GB
          disk-root: "C:"

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
            echo "version=v${VERSION}" >> "$GITHUB_OUTPUT"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install Dependencies
        run: npm ci

      - name: Clean signing key
        shell: bash
        run: |
          CLEAN_KEY=$(echo -n "$RAW_KEY" | tr -d '\r\n ')
          echo "TAURI_SIGNING_PRIVATE_KEY=$CLEAN_KEY" >> $GITHUB_ENV
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0.5.15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          CARGO_BUILD_JOBS: 2
          NODE_OPTIONS: "--max_old_space_size=4096"
        with:
          tagName: ${{ steps.version.outputs.version }}
          releaseName: 'ARK Server Manager ${{ steps.version.outputs.version }}'
          prerelease: false
          # Note: GitHub Actions limits expressions to 21,000 characters. Keep only the current release
          # and immediate prior release in releaseBody; historical changelogs are in CHANGELOG.md.
          releaseBody: |
            ## 🚀 ARK Server Manager ${{ steps.version.outputs.version }} (Latest Release)

            ### Installation
            - **Auto-Update**: If you already have the app installed, it will auto-detect this release and prompt you to update.
            - **Windows**: Download the `.exe` installer below.
            - **Linux Desktop**: Download the `.AppImage` or `.deb` package below (`chmod +x *.AppImage` to run).
            - **Linux Headless / CLI**: Run `curl -fsSL https://raw.githubusercontent.com/sanjay-m6/ARK-ASA-SERVER-MANAGER-2.0/main/scripts/install.sh | bash`

            ### 🆕 New Features & Bug Fixes in v4.6.34
            - **📁 Direct Server Folder Rename & Relocate Action (`INSTALLATIONSPFAD`)**:
              - Added an intuitive **Change / Rename** action button and click-to-edit directly beside `INSTALLATIONSPFAD` in both Card and List views (for both ASA and ASE).
              - Added a quick-launch button to open the installation directory directly in Windows Explorer.
            - **⚡ Fast Instant Rename on Same Drive (Zero-Downtime Migration)**:
              - Implemented atomic same-volume filesystem rename in the Rust backend (`move_server`), completing folder renames in milliseconds instead of slow 20-minute disk copies.
              - Automatically falls back to resilient streaming copy if moving across different physical drives.
            - **🔄 Smart Re-linking for Manually Renamed Folders**:
              - If a server directory was already renamed or moved externally in Windows Explorer, the manager automatically detects the existing installation and re-links the SQLite database path cleanly without "source not found" errors.
            - **🗂️ Interactive Move & Rename Modal (`MoveServerDialog`)**:
              - Displays clear Current Folder Path and New Destination Path.
              - Added an editable text field to customize the target folder name (e.g. changing `server1` to `TheIsland`) with real-time path preview.
              - Integrated directory browser ("Browse Folder...") for effortless relocation.
            - **🛡️ Bulk Migration Subfolder Isolation & Safety Safeguards**:
              - Fixed bulk migration so each selected server instance is moved into its own isolated subfolder, preventing file collision across servers.
              - Enforced clear user notifications requiring servers to be stopped before migration, avoiding file-lock corruption.

            ### 🛠️ Previous Releases
            <details>
            <summary>v4.6.33 — Fix SteamCMD Update Failure & Error App 2430930 (State 0x6 / 0x406), Guardian Clean Exit & MapName Alignment</summary>

            - **🛠️ Fix SteamCMD Update Failure & Error App 2430930 (State 0x6 / 0x406 / Disk Write Failure)**:
              - Clarified that `2430930` is the official Steam App ID for the ARK: Survival Ascended Dedicated Server (not an error code).
              - Resolved disk write failures during server updates by waiting up to 12s for active `ArkAscendedServer.exe` processes to fully release binary and DLL file locks before SteamCMD starts.
              - Implemented automated self-healing for corrupted SteamCMD manifests: actively detects `State 0x6` and `State 0x406` (corrupted manifest / incomplete staging), automatically purges the poisoned `appmanifest_2430930.acf` and invalid downloading staging cache, and avoids restoring corrupt backups so SteamCMD validates and repairs existing game files cleanly on retry.
              - Enhanced diagnostic error reporting with clear root-cause breakdown and tailored actionable fix steps.
            - **🛡️ Guardian Watchdog Clean Exit & Duplicate Process Protection**:
              - Added clean exit detection (`exit code 0` / status stopped) in the watchdog monitor to prevent unnecessary auto-restart loops when servers terminate intentionally or perform launcher handoffs.
              - Added safety guard to prevent redundant restart attempts when the server is already verified as running.
            - **💾 Data Integrity Hardening for Intelligent Auto-Repair**:
              - Ensured Intelligent Mode auto-repair never purges active installed mods or launches without mods (which could wipe modded structures/items from world saves); now only cleans `.temp` compiler caches and safely restarts with all configured mods intact.
            - **🗺️ MapName Normalization in GameUserSettings.ini & Insaluna Mod ID Alignment**:
              - Enforced `MapName` and `ServerMap` alignment in `GameUserSettings.ini` under `[ServerSettings]` to prevent duplicate save directories or blank day-1 worlds.
              - Corrected Insaluna mod map ID to official CurseForge package `939532`.
            </details>
            <details>
            <summary>v4.6.32 — Fix Linux Root Installation, Cryo Fridge Requirement #41 & React Error #310</summary>

            - **🐧 Fix Linux Server Installation Under Root User**:
              - Added root user detection, automatic user isolation, permission normalization, and SteamCMD invocation flags so server installations complete reliably without manual user switching.
            - **🧊 Fix "Disable Cryo Fridge Requirement" Setting Having No Effect (#41)**:
              - Corrected config mapping and INI key alignment (`DisableCryopodFridgeRequirement` in `GameUserSettings.ini` under `[ServerSettings]`).
            - **⚛️ Fix React Error #310 in Server Overview Modal ("View Full Server Overview & Details")**:
              - Declared all hooks unconditionally at the top level of `ServerOverviewModal`, and guarded modal mounting.
            - **🧠 AI Assistant & Cross-Platform File Management Hardening**:
              - Enhanced error resilience, cross-platform path handling, and assistant prompt stability.
            </details>

            <details>
            <summary>v4.6.31 — Fix React Error #310, Release Asset Download URLs & Watchdog Resilience</summary>

            - **⚛️ Fix React Error #310 in Server Overview Modal**:
              - Lifted `useServerStore` and `useAseServerStore` hooks to the top level of `ServerOverviewModal`.
            - **🔗 Fix Release Asset Download & Rollback URL Alignment (`ARK.Server.Manager`)**:
              - Aligned all manual fallback and rollback links to canonical GitHub release binary naming `ARK.Server.Manager_${version}_x64-setup.exe`.
            - **🛡️ Guardian Watchdog Crash Auto-Restart Resilience**:
              - Hardened auto-restart retry loop to gracefully handle transient startup failures following unexpected server exits.
            </details>

            *For full release notes of previous versions, please visit the [Releases Archive](https://github.com/sanjay-m6/ARK-ASA-SERVER-MANAGER-2.0/releases) or see [CHANGELOG.md](https://github.com/sanjay-m6/ARK-ASA-SERVER-MANAGER-2.0/blob/main/CHANGELOG.md).*
          releaseDraft: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Verify Release Signatures
        run: node scripts/verify-release-signatures.js
