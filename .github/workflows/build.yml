name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
            echo "version=v${VERSION}" >> "$GITHUB_OUTPUT"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install Dependencies
        run: npm ci

      - name: Clean signing key
        shell: bash
        run: |
          CLEAN_KEY=$(echo -n "$RAW_KEY" | tr -d '\r\n ')
          echo "TAURI_SIGNING_PRIVATE_KEY=$CLEAN_KEY" >> $GITHUB_ENV
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0.5.15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ steps.version.outputs.version }}
          releaseName: 'ARK Server Manager ${{ steps.version.outputs.version }}'
          prerelease: false
          # Note: GitHub Actions limits expressions to 21,000 characters. Keep only the current release
          # and immediate prior release in releaseBody; historical changelogs are in CHANGELOG.md.
          releaseBody: |
            ## 🚀 ARK Server Manager ${{ steps.version.outputs.version }} (Latest Release)

            ### Installation
            - **Auto-Update**: If you already have the app installed, it will auto-detect this release and prompt you to update.
            - **Windows**: Download the `.exe` installer below.
            - **Linux Desktop**: Download the `.AppImage` or `.deb` package below (`chmod +x *.AppImage` to run).
            - **Linux Headless / CLI**: Run `curl -fsSL https://raw.githubusercontent.com/sanjay-m6/ARK-ASA-SERVER-MANAGER-2.0/main/scripts/install.sh | bash`

            ### 🆕 New Features & Bug Fixes in v4.6.28
            - **🛡️ Fix Afternoon & Scheduled Restarts Failing to Start Up**:
              - Resolved critical issue where afternoon/morning scheduled restarts and manual reboots cleanly stopped servers and completed pre-restart backups, but failed to start servers back up.
              - Removed `game_port + 1` from process termination target ports in `restart_server` and `launcher::stop_server`, preventing restart sequences from force-killing adjacent cluster servers running on consecutive ports (e.g. 7777 and 7778).
              - Removed invalid `-PeerPort` command line argument and redundant `("Peer", game_port + 1)` port check from `ProcessManager::start_server` which caused consecutive ASA cluster nodes to falsely collide and abort startup.
              - Implemented protocol-aware port checking (`is_udp_port_in_use` for Game/Query UDP sockets and `is_tcp_port_in_use` with active connection probing for RCON TCP sockets), preventing post-shutdown Windows `TIME_WAIT` socket states from falsely timing out and aborting server launches.
              - Updated startup conflict validation so that offline/dormant server profiles in the database never block active server launches.
            - **⚡ Fix Map Starts Becoming Unresponsive in Server Manager**:
              - Fixed `checkPortsBeforeStart` in Server Manager to only intercept on active port conflicts (`has_active_conflicts`) rather than offline/inactive profile matches, allowing manual map launches to respond immediately.
              - Updated `PortConflictModal` to always provide an active "Start Anyway" button so administrators are never locked out of starting their servers.
              - Updated frontend `portAllocator` to restrict Raw Port (`gp + 1`) reservations to ASE servers only, allowing ASA servers to use consecutive ports without conflict warnings.
            - **📢 Startup Observability & Failure Reporting**:
              - Added real-time in-app console logging (`server_log` event) and Discord webhook failure embed alerts when a server startup fails, providing immediate diagnostic error details rather than silent failure.
            - **🌐 Comprehensive Internationalization & UI Polish**:
              - Synchronized and updated localization dictionaries across all supported languages (DE, EN, ES, FR, IT, JA, KO, PT-BR, RU, TA, TR, ZH-CN, ZH-TW).

            ### 🛠️ Previous Releases
            <details>
            <summary>v4.6.27 — Fix Server Startup Failure on Restarts, Port Releases, and Discord Rate-Limits</summary>

            - **🛡️ Fix Server Startup Failure on Restarts & Port Release Engine (Exit Code 0)**:
              - Resolved critical issue where servers failed to start back up after scheduled morning/afternoon restarts or manual reboots, shutting down immediately upon startup with exit code 0.
              - Implemented process termination wait (`WaitForSingleObject`) with forceful `taskkill /F /T` fallback to guarantee old processes have completely terminated before launching new instances.
              - Added socket cleanup engine (`kill_processes_on_ports`) on game port (7777), query port (27015), and RCON port (27020) to eliminate lingering UDP/TCP socket holds in Windows network tables (`TIME_WAIT`/closing).
              - Added active port availability polling prior to server binary spawning, preventing Unreal Engine dedicated servers from aborting due to port contention.
              - Protected Guardian Watchdog state machine so terminating restart processes do not falsely overwrite starting/running servers with `stopped`.
              - Offloaded scheduler restart routines and player warning countdowns into asynchronous background tasks (`tauri::async_runtime::spawn`), preventing minute-by-minute countdown sleeps from freezing the scheduler ticker.
              - Fixed scheduled restart task routing to accurately distinguish between ASE and ASA servers, executing appropriate RCON commands and engine-specific launch sequences.
            - **📡 Discord Webhook Reliability & HTTP 429 Rate-Limit Auto-Retry**:
              - Resolved intermittent and dropped Discord notifications during server maintenance and restart cycles.
              - Implemented automatic retry mechanism (up to 4 attempts) on HTTP 429 `Too Many Requests` with exponential backoff honoring Discord's `Retry-After` header and body.
              - Updated server name resolution (`get_server_name`) to support both ASA (`servers`) and ASE (`ase_servers`) tables so server titles in Discord embeds are always accurate.
            - **🦅 Automatic Flier Riding Setting (`bForceCanRideFliers`)**:
              - Automatically preserves and defaults `bForceCanRideFliers=True` whenever General Settings are saved or modified, decoupling it from cave flyer restrictions and ensuring flying mounts remain mountable across all supported maps.
            </details>

            *For full release notes of previous versions, please visit the [Releases Archive](https://github.com/sanjay-m6/ARK-ASA-SERVER-MANAGER-2.0/releases) or see [CHANGELOG.md](https://github.com/sanjay-m6/ARK-ASA-SERVER-MANAGER-2.0/blob/main/CHANGELOG.md).*
          releaseDraft: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Verify Release Signatures
        run: node scripts/verify-release-signatures.js
