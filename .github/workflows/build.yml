name: Build & Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      
      - name: Rust Cache
        uses: swatinem/rust-cache@v2.7.5
        with:
          workspaces: 'src-tauri -> target'
      
      - name: Install Dependencies
        run: npm ci
      
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0.5.15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ARK Server Manager ${{ github.ref_name }}'
          releaseBody: |
            ## 🚀 ARK Server Manager ${{ github.ref_name }}

            This release brings major feature additions including ASE Server Cloning, a comprehensive Plugin Manager, the brand new Infinity Floating Damage System tool, and critical GUI fixes.

            ### ✨ What's New
            - **ASE Server Cloning & Clustering**: Easily clone existing ASE servers using the new Clone Options Modal to quickly spin up instances with custom configurations, ports, and clusters.
            - **Plugin Manager**: A fully integrated Plugin Manager UI allowing you to browse, search, configure, install/uninstall, and enable/disable server plugins seamlessly.
            - **Infinity Floating Damage System**: Customize in-game damage indicators, colors, sizing, outline effects, animations, critical hit feedback, and boss damage stylings with real-time UI previews.
            - **Custom GUI Color Picker**: Replaced native HTML color pickers with a premium React popover color picker, providing color preset swatches, RGB sliders, and manual Hex inputs.
            - **GUI Focus & Search Fixes**: Solved Tauri/WebView2 keypress hijacking issues on search/filter inputs, allowing smooth text entry inside category filters, text fields, and color selectors.

            ### Install
            Download the `.msi` or `.exe` installer below.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          includeUpdaterJson: true
