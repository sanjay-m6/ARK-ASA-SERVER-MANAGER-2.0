name: Build & Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      
      - name: Rust Cache
        uses: swatinem/rust-cache@v2.7.5
        with:
          workspaces: 'src-tauri -> target'
      
      - name: Install Dependencies
        run: npm ci
      
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0.5.15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ARK Server Manager ${{ github.ref_name }}'
          releaseBody: |
            ## 🚀 ${{ github.ref_name }} — Pre-Release Build

            This is a pre-release beta version for v2.4.1 containing stability fixes, UI enhancements, and organization layout fixes.

            ### ✨ What's New
            - **ASE Modern Config Editor**: Redesigned UI configuration editor for ASE servers with a tabbed interface (GameUserSettings.ini & Game.ini).
            - **DoExit Graceful Shutdown**: Fixed an issue in both ASA and ASE where shutting down the server via the RCON `DoExit` command was incorrectly detected as a server crash instead of a normal shutdown.
            - **AI Copilot Notifications**: Fixed a bug where the AI Copilot would show unread notification counts (1, 2, 3...) but display no new messages when opened.
            - **Server Organization**: Fixed a display bug where assigned servers were not showing up inside their organizational folders due to missing data in the backend pipeline.

            ### Install
            Download the `.msi` installer below.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          includeUpdaterJson: true

