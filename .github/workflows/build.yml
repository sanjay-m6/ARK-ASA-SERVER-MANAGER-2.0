name: Build & Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
      
      - name: Install Dependencies
        run: npm ci
      
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ASA Server Manager ${{ github.ref_name }}'
          releaseBody: |
            ## 🚀 v2.2.9 — Server Status Reliability & Discord Bot Improvements

            ### ✅ Critical Fixes
            - **Server Status Race Condition** — Fixed servers stuck in "LOADING…" / "STARTING…" even after coming online. Status now transitions to 🟢 ONLINE only when the server log confirms `"Advertising for join"`.
            - **Log Baseline System** — Only new log lines (after server start) are scanned for startup confirmation; prevents ghost-online from stale logs.
            - **DB Sync on Restart** — Manager correctly restores `online` status from disk logs when reopened with a server already running.

            ### 🆕 New Features
            - **Startup Progress Timer** — Live elapsed-time counter shown inside the status badge (e.g., `LOADING... 2m 14s`).
            - **Force Stop Button** — Instantly abort a problematic startup from the status badge.
            - **Discord Admin Commands** — New `!update` and `!broadcast` bot commands for admin-channel server control.

            ### 🐛 Bug Fixes
            - Fixed Discord bot showing servers as offline in cluster status embeds.
            - Fixed Auto-Update Mods task type not displaying label/icon in Scheduler UI.
            - Fixed assigned firewall ports incorrectly showing as Closed after assignment.
            - Fixed Offers Toggle (`is_active` / `isActive` mismatch).
            - Fixed clusters failing to delete, leaving orphaned DB entries.
            - Fixed `toggleServerAutomation` being called twice per button press.

            ### Install
            Download the `.msi` installer below.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
