name: Build & Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
      
      - name: Install Dependencies
        run: npm ci
      
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ASA Server Manager ${{ github.ref_name }}'
          releaseBody: |
            ## 🦖 v2.2.8: Bug Fixes & Discord Bot Integration
            
            ### 🐛 Bug Fixes
            - **Discord Webhook Save** — Fixed webhook configurations not saving properly.
            - **Discord Bot Save** — Fixed bot integration settings not persisting on save.
            - **Discord Server Status** — Fixed servers showing as offline in Discord when actually online.
            - **Cluster Deletion** — Fixed clusters not being deletable.
            - **Cluster Bot Integration** — Discord Bot now correctly reports real-time server status.
            - **Mod Downloads** — Fixed mods failing to download and install.
            - **Player Stat Controls** — Fixed player stat controls not applying in Config Editor.
            
            ### ✨ New Features
            - **Server Console Window** — Pop up the actual ARK server console directly from the app.
            - **Discord Bot Online Status** — Bot now appears online in Discord.
            - **Generate Invite Link** — One-click bot invite with correct permissions.
            - **Bot Setup Guide** — In-app setup guide for Discord Bot configuration.
            
            ### Install
            Download the `.setup.exe` or `.msi` below.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
