<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ARK Server Manager - Manage your ARK: Survival Ascended and ARK: Survival Evolved servers with ease." />
  <meta property="og:title" content="ARK Server Manager" />
  <meta property="og:description" content="Manage your ARK: Survival Ascended and ARK: Survival Evolved servers with ease." />
  <title>ARK Server Manager</title>
  <script>
    (function() {
      try {
        var t = localStorage.getItem('ark-app-theme') || 'aurora-dark';
        if (['aurora-dark', 'midnight-blue', 'cyber-neon', 'arctic-light'].indexOf(t) === -1) {
          t = 'aurora-dark';
        }
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.classList.add('theme-' + t);
        if (t === 'arctic-light') {
          document.documentElement.classList.add('light');
        } else {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>
  <style>
    html, body, #root {
      background-color: #06090f;
      color: #f8fafc;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
