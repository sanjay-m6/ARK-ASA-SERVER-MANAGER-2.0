[package]
name = "asa-server-manager"
version = "4.6.19"
description = "ASA Server Manager 2.0 - Professional ARK: Survival Ascended Server Management"
authors = ["Sanjay"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ark_server_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
embed-resource = "2"

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
simplelog = "0.12"

tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
ini = "1.3"
sysinfo = "0.32"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
reqwest = { version = "0.12", features = ["stream", "json", "blocking"] }
zip = "2.1"
scraper = "0.19"
bytes = "1"
cron = "0.13"
walkdir = "2"
notify = "6.1.1" # File system monitoring
sevenz-rust = "0.6.1"
flate2 = "1.1.8"
tar = "0.4.44"
rar = "0.4.0"
unrar = "0.5.8"
base64 = "0.22.1"
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "rustls_backend", "model"] }
futures-util = "0.3"
igd-next = { version = "0.17.0", features = ["aio_tokio"] }
opendal = { version = "0.56.0", features = ["services-s3", "services-gdrive", "services-dropbox", "services-b2", "services-ftp"] }
zstd = "0.13.3"
aes-gcm = "0.10.3"
rand = "0.10.1"
sha2 = "0.11.0"
ring = "0.17.14"
urlencoding = "2"
lazy_static = "1.4"
hex = "0.4"
local-ip-address = "0.6.13"
indexmap = "2.14.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_UI_Shell", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

